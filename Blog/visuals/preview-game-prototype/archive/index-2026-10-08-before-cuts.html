<!doctype html>
<!--
  PROTOTYPE — throwaway. Fourteen candidate figures for the team-preview section (why VGC is a nested
  optimisation problem, team preview first), one page, switchable via ?variant=A…N, the bottom bar, or ← →.
    A Matryoshka · B Jenga · C Mind-reading chase · D Loaded spinner · E Thinking makes MB522 worse
    F Periscope · G Album-cover ridgelines · H String art · I Times table · J Sieve · K Three chairs
    L Guess Who? · M Sand timer · N Minesweeper
  Real data only: MB522 vs MB763, 90 x 90 plans x 24 battles (data.js, built by build-data.py).
  Stage 2 built layout and state for all 14. Stage 3 (2026-10-07) adds motion to A3 only, the version the owner kept;
  2026-10-07 stage 3 also on C (cards enter, arrows light, ring on loop close) and D (spinners spin and land, result
  after the stop, readouts roll). Stage 5 applied the approved stage-4 proposals to A3 (score leaves from the whole board after the 121 equilibrium
  squares light up; a 90 → 30 → 6 → 3 → 1 plan counter; a row × column crosshair at lock-in) plus audit fixes
  (flights pin to the viewport edge on phones, entrance scales from 0.9). Every other variant is still motionless.
  Run: the "blog-visuals" server in .claude/launch.json, then open /preview-game-prototype/?variant=A
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Preview Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* The blog's Distill article system, same tokens as team-preview-section: one reading column, wide figures,
   numbered grey captions. Colour roles: --you = MB522, --them = MB763, --back = the back pair.
   Motion exists only in variant A3 (stage 3); tokens below, reduced-motion overrides at the end of the A3 block. */
:root{
  --bg:#FFFFFF; --ink:#1F2328; --body:#2E3338; --muted:#6A7178; --faint:#9AA1A8; --rule:#E3E6EA; --panel:#F6F7F9;
  --you:#0E7C7B; --you-soft:#E3F2F1; --them:#B23A5A; --them-soft:#F7E6EB; --back:#B7791F; --back-soft:#F7EEDD; --cell:#E5E8EC;
  --ridge-bg:#16191C; --ridge-line:#EEF1F4; --ridge-hi:#4FC2BF;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bar-bg:#111; --bar-btn:#2a2a2a; --bar-fg:#fff; --bar-code:#cfe3ff;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121518; --ink:#E8EBEE; --body:#C9CED3; --muted:#9AA1A8; --faint:#6D747B; --rule:#2A3036; --panel:#1A1E22;
    --you:#4FC2BF; --you-soft:#16312F; --them:#E58AA0; --them-soft:#3A2129; --back:#E3A443; --back-soft:#382A13; --cell:#2A3138;
    --ridge-bg:#0B0D0F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121518; --ink:#E8EBEE; --body:#C9CED3; --muted:#9AA1A8; --faint:#6D747B; --rule:#2A3036; --panel:#1A1E22;
  --you:#4FC2BF; --you-soft:#16312F; --them:#E58AA0; --them-soft:#3A2129; --back:#E3A443; --back-soft:#382A13; --cell:#2A3138;
  --ridge-bg:#0B0D0F;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--body);font:16.5px/1.65 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
.page{display:grid;grid-template-columns:minmax(16px,1fr) minmax(0,660px) minmax(0,240px) minmax(16px,1fr);column-gap:32px;padding-block:40px 150px}
.page > *, section.variant > *{grid-column:2;min-width:0}
.page > .wide, section.variant > .wide{grid-column:2 / 4}
section.variant{display:contents}
@media (max-width:980px){
  .page{grid-template-columns:16px minmax(0,1fr) 16px;column-gap:0}
  .page > .wide, section.variant > .wide{grid-column:2}
}
h1{font:700 clamp(32px,5vw,44px)/1.12 var(--sans);color:var(--ink);margin:0 0 10px;letter-spacing:-0.015em}
.dek{font-size:19px;line-height:1.5;color:var(--muted);margin:0 0 22px;max-width:36em}
.byline{display:flex;flex-wrap:wrap;gap:12px 32px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:12px;margin-bottom:26px;font-size:13px;color:var(--muted)}
.byline > div{display:flex;flex-direction:column;gap:4px;min-width:0}
.byline b{font:600 11px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
h2{font:600 24px/1.3 var(--sans);color:var(--ink);margin:4px 0 8px}
p{margin:0 0 16px}
.lab{font:600 11px/1.35 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.serves{margin-top:6px;color:var(--faint)}
.proto{color:var(--them);margin-bottom:14px}
figure{margin:8px 0 30px;display:grid;gap:12px}
.fig{background:var(--panel);border-radius:6px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
.fig > *{min-width:0}
figcaption{font-size:13.5px;line-height:1.55;color:var(--muted);max-width:52em}
figcaption b{color:var(--ink);font-weight:600}
.read{font-size:14.5px;color:var(--ink);line-height:1.55;margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.y{color:var(--you);font-weight:600}.t{color:var(--them);font-weight:600}.b{color:var(--back);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:600 30px/1.1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
button{font:500 13px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:7px 12px;min-height:34px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.spread{justify-content:space-between}
select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);max-width:100%}
label.note{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0;max-width:100%}
label.note select{flex:1 1 240px;min-width:0;max-width:100%}
img.sp{image-rendering:pixelated;display:block;flex:none}
img.sp.dim{opacity:.25;filter:grayscale(1)}
.six{display:inline-flex;gap:2px;align-items:center;flex-wrap:wrap}
canvas{display:block;width:100%;height:auto}
.canvas-wrap{position:relative;margin-inline:auto;width:100%}
details summary{cursor:pointer;font-size:13.5px;color:var(--ink)}
table{border-collapse:collapse;font-size:13.5px}
th{font:600 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 10px 6px 0}
td{padding:4px 10px 4px 0;border-top:1px solid var(--rule)}

/* a plan: two leads (big) | two in the back (smaller) | optionally the two left at home (grey) */
.plan{display:inline-flex;align-items:flex-end;gap:4px;vertical-align:middle}
.plan .pair{display:inline-flex;flex-direction:column;align-items:center;border-radius:6px;padding:2px 3px}
.plan .pair > span{display:inline-flex;gap:1px;align-items:flex-end}
.plan .pair i{font:600 9px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.plan.you .lead{background:var(--you-soft)}.plan.them .lead{background:var(--them-soft)}
.plan .back{background:var(--back-soft)}
.plan .home img{opacity:.3;filter:grayscale(1)}

/* A — Matryoshka */
.shelf{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:center}
.doll{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:100%}
.dollbody{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;cursor:pointer;width:100%;min-width:0}
.dollbody:focus-visible{outline:2px solid var(--you);outline-offset:4px;border-radius:14px}
.doll .head{width:38%;aspect-ratio:1;border-radius:50%;background:var(--you-soft);border:2px solid var(--you);display:grid;place-items:center;margin-bottom:-14px;position:relative;z-index:1}
.doll .body{width:100%;border-radius:50% 50% 44% 44% / 38% 38% 62% 62%;background:var(--bg);border:2px solid var(--you);display:grid;place-items:center;padding:34px 16px 30px;overflow:hidden}
.doll.shut .body{background:var(--you-soft)}
.doll .q{font:600 40px/1 var(--mono);color:var(--you)}
.paint{display:grid;justify-items:center;gap:6px}
.vs{font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts{display:grid;gap:3px;font-size:13px;line-height:1.45;color:var(--body)}
.facts b{color:var(--ink)} .facts i{font-style:normal;color:var(--faint)}

/* A diagnosis: the version picker (prototype control, not part of the design) */
.probe{border:2px dashed var(--them);border-radius:8px;padding:12px 14px;display:grid;gap:10px;margin:0 0 18px}
img.board{image-rendering:pixelated;display:block}
.pips{display:grid;gap:4px}
.pips div{display:flex;gap:4px;align-items:center}
.pips .note{width:52px}
.pips i{width:12px;height:12px;border-radius:50%}
.pips i.w{background:var(--you)} .pips i.l{background:var(--them);opacity:.5}
/* A1 — really nested */
.ndoll{display:grid;justify-items:center;width:100%;margin:6px auto 0}
.ndoll .nhead{width:90px;height:90px;border-radius:50%;border:2px solid var(--you);background:var(--you-soft);margin-bottom:-14px;position:relative;z-index:1}
.ndoll .nbody{width:100%;border:2px solid var(--you);border-radius:48% 48% 40% 40% / 12% 12% 16% 16%;background:var(--bg);padding:26px 28px 30px;display:grid;justify-items:center;gap:8px;text-align:center}
.ndoll.l1{max-width:640px} .ndoll.l2{max-width:480px} .ndoll.l3{max-width:330px}
.ndoll.l2 > .nbody{background:var(--you-soft)}
.ndoll.l2 > .nhead{width:68px;height:68px;background:var(--bg)} .ndoll.l3 > .nhead{width:50px;height:50px}
/* A2 — no dolls */
.levels{display:grid;gap:6px}
.lvl{display:grid;grid-template-columns:minmax(150px,200px) minmax(150px,auto) minmax(0,1fr);gap:8px 18px;align-items:center;border-top:1px solid var(--rule);padding-top:10px}
.lvl .what{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lvl i{font-style:normal;color:var(--faint)}
.up{margin:0 0 0 8px}
@media (max-width:720px){.lvl{grid-template-columns:1fr}}
/* A3 — the game's own nesting */
.gamenest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gpanel{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start}
.box{display:flex;flex-wrap:wrap;gap:1px;max-height:260px;overflow:auto}
.box img{opacity:.55} .box img.mine{opacity:1;outline:2px solid var(--you);border-radius:4px}
.box .dot{width:22px;height:22px;display:grid;place-items:center}
.box .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.party{display:grid;gap:4px}
.pslot{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.25;border:1px solid var(--rule);border-radius:8px;padding:2px 6px}
.tp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tpslot{position:relative;border:1px solid var(--rule);border-radius:6px;display:grid;place-items:center;padding:2px;opacity:.45}
.tpslot.in{opacity:1}
.tp.you .tpslot.in{border-color:var(--you);background:var(--you-soft)} .tp.them .tpslot.in{border-color:var(--them);background:var(--them-soft)}
.tpslot b{position:absolute;top:1px;right:4px;font:600 11px var(--mono);color:var(--ink)} .tpslot b.out{color:var(--faint)}
.fieldbox{border-radius:8px;background:linear-gradient(180deg,var(--panel),var(--cell));padding:8px;display:grid;gap:10px}
.fieldbox .side{display:flex;gap:6px}
.fieldbox .side.them{justify-content:flex-end}
@media (max-width:900px){.gamenest{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.gamenest{grid-template-columns:1fr}}
.steps{display:flex;flex-wrap:wrap;gap:4px 18px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--faint)}
.steps li.now{color:var(--ink);font-weight:600} .steps li.done{color:var(--muted)}
.gpanel.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
button.tpslot{background:var(--bg);min-height:0;cursor:pointer;opacity:.8}
button.tpslot:disabled{cursor:default}
.tpslot.wait{opacity:.8}
.minib-row{display:flex;gap:10px;align-items:center}
.minib{position:relative;width:120px;flex:none}
.minib .mk{position:absolute;width:10px;height:10px;border:2px solid var(--ink);border-radius:2px;translate:-50% -50%;background:transparent;transform-origin:center;z-index:2}
.minib .spot{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.minib .band{position:absolute;background:var(--ink);opacity:.35;pointer-events:none}
.minib .band.row{left:0;right:0;height:3px;translate:0 -50%} .minib .band.col{top:0;bottom:0;width:3px;translate:-50% 0}
.plancount{margin:0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.plancount b{display:inline-block;font-size:18px;color:var(--ink);min-width:2ch}
/* A3 motion (stage 3). Explanatory, reader-started: strong ease-out for things appearing, ease-in-out for things travelling. */
.steps li{transition:color 200ms ease}
.gpanel{transition:border-color 200ms ease,box-shadow 200ms ease}
.tpslot{transition:opacity 200ms ease,background-color 200ms ease,border-color 200ms ease}
.tpslot.out{opacity:.45}
button.tpslot{transition:opacity 200ms ease,background-color 200ms ease,border-color 200ms ease,transform 120ms var(--ease-out)}
button.tpslot:not(:disabled):active{transform:scale(0.96)}
.tpslot .badge{opacity:0;transform:scale(0.9);transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out)}
.tpslot .badge[data-on="true"]{opacity:1;transform:none}
.gpanel .row button{transition:transform 120ms var(--ease-out)}
.gpanel .row button:not(:disabled):active,.gpanel > button:active{transform:scale(0.97)}
.fieldbox img{transform-origin:0 0}
.minib-row{transition:opacity 250ms var(--ease-out)}
@starting-style{.minib-row{opacity:0}}
.pips.live i{opacity:0;transform:scale(0.9);transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
.pips.live i.on{opacity:1;transform:none}
.pips.live i.l.on{opacity:.5}
.scoreline{transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out)}
@starting-style{.scoreline{opacity:0;transform:translateY(4px)}}
.flyer{position:fixed;z-index:30;pointer-events:none;font:600 13px var(--mono);background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px;white-space:nowrap}
.minib .spot{opacity:0;transition:opacity 300ms var(--ease-out)} .minib .spot[data-on="true"]{opacity:1}
@media (prefers-reduced-motion: reduce){
  .tpslot .badge,.pips.live i{transform:none;transition:opacity 160ms ease}
  button.tpslot:not(:disabled):active,.gpanel .row button:not(:disabled):active,.gpanel > button:active{transform:none}
  .scoreline{transform:none;transition:opacity 200ms ease}
  @starting-style{.scoreline{transform:none}}
}
/* A3 stepper (rebuilt 2026-10-07): one stage at a time, Pokémon travel between stages */
.nest{display:grid;gap:14px}
.nest .steps li button{all:unset;cursor:pointer;color:inherit;font:inherit}
.nest .steps li button:disabled{cursor:default}
.nest .steps li button:focus-visible{outline:2px solid var(--you);outline-offset:2px;border-radius:4px}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tchip{border:1px solid var(--rule);border-radius:8px;padding:4px 8px;display:grid;gap:2px;min-height:46px;align-content:center;background:var(--bg);transition:border-color 200ms ease,box-shadow 200ms ease}
.tchip.lit{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tarrow{color:var(--faint)}
.stagepane{display:grid;gap:12px;transition:opacity 250ms var(--ease-out)}
@starting-style{.stagepane{opacity:0}}
.build{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;align-items:start}
.box.big{max-height:320px;gap:2px}
.box .bx{all:unset;box-sizing:border-box;cursor:pointer;width:26px;height:26px;display:grid;place-items:center;border-radius:5px;transition:opacity 200ms ease,background-color 200ms ease}
.box .bx img{opacity:.55;width:22px;height:22px;image-rendering:pixelated}
.box .bx.ring{outline:2px solid var(--you);outline-offset:-1px;background:var(--you-soft)} .box .bx.ring img{opacity:1}
.box .bx.taken{opacity:.2;cursor:default}
.box .bx .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);display:block}
.box .bx:focus-visible{outline:2px solid var(--ink)}
.box .bx:active:not(.taken){transform:scale(0.94)}
.box .bx{transition:opacity 200ms ease,background-color 200ms ease,transform 120ms var(--ease-out)}
.partycol{display:grid;gap:4px}
.partycol .slot{min-height:44px;border:1px dashed var(--rule);border-radius:8px;display:flex;align-items:center;gap:8px;padding:2px 6px;font-size:13px;line-height:1.25}
.partycol .slot.full{border-style:solid}
.derive{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline}
.factor{display:inline-block;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out)}
@starting-style{.factor{opacity:0;transform:translateY(4px)}}
.previewscreen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
.pcol{display:grid;gap:4px;justify-items:center}
.pcol .tpslot{width:60px;height:52px}
.pcol.you .tpslot.in{border-color:var(--you);background:var(--you-soft)} .pcol.them .tpslot.in{border-color:var(--them);background:var(--them-soft)}
.pmid{display:grid;gap:10px;align-content:start}
.fieldbox.big{min-height:230px;padding:16px;align-content:space-between}
.fieldbox.big .side{align-items:flex-end;gap:10px}
.fieldbox.big .side.them{justify-content:flex-end;align-items:flex-start}
.fieldbox.big .gap{flex:1}
.benched{opacity:.6;display:inline-flex}
.scoreview{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.minib.big{width:240px}
.nest [data-fk]{transform-origin:0 0}
@media (max-width:720px){.build,.scoreview{grid-template-columns:1fr}.previewscreen{grid-template-columns:auto auto;}.previewscreen .pmid{grid-column:1 / -1;grid-row:2}}
@media (prefers-reduced-motion: reduce){
  .factor{transition:opacity 200ms ease} @starting-style{.factor{transform:none}}
  .box .bx:active:not(.taken){transform:none}
}
/* A4 — click down */
.drill{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.5fr) auto minmax(0,1fr);gap:10px;align-items:center}
.dpanel{display:grid;gap:8px;justify-items:start;align-content:start}
.darrow{white-space:nowrap}
.darrow .ar::before{content:"←"}
@media (max-width:900px){.drill{grid-template-columns:1fr}.darrow{white-space:normal}.darrow .ar::before{content:"↑"}}

/* B — Jenga */
.jenga{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start}
.tower{display:grid;gap:4px;width:190px}
.tower .slot{border-radius:7px;min-height:44px}
.tower .slot.gap{box-shadow:inset 0 0 0 2px var(--faint)}
.block{width:100%;display:flex;align-items:center;gap:8px;border-radius:7px;padding:4px 10px;justify-content:flex-start;min-height:44px}
.tower.you .block{background:var(--you-soft);border-color:var(--you)}
.tower.them .block{background:var(--them-soft);border-color:var(--them)}
.tower .slot:nth-child(odd) .block{width:calc(100% - 10px)}
.tower.you .block.out{translate:-46px 0;border-style:dashed}
.tower.them .block.out{translate:46px 0;border-style:dashed}
.tower.them .slot:nth-child(odd) .block{margin-left:10px}
.mid{display:grid;justify-items:center;gap:8px;text-align:center}
svg.gauge .axis,svg.gauge .tick{stroke:var(--faint)} svg.gauge .tl{font:11px var(--mono);fill:var(--muted)}
svg.gauge .ghost{stroke:var(--faint);stroke-dasharray:4 3;stroke-width:2} svg.gauge .mark{fill:var(--you)} svg.gauge .vl{font:600 14px var(--mono);fill:var(--ink)}
svg.gauge .half{stroke:var(--rule);stroke-width:1}
.grids{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pgrid{display:grid;gap:2px;margin:6px 0 10px}
.pgrid > div{display:flex;gap:2px}
.pgrid i{width:13px;height:13px;border-radius:2px;background:var(--cell)}

<script>
const { html, render, useState, useMemo, useEffect, useLayoutEffect, useRef, useCallback } = htmPreact;
const P = window.PREVIEW;
const T = P.teams, PL = { you: P.rows, them: P.cols }, NAMES = P.names;
const Wm = P.wins, NB = P.battles;
const M = Wm.map(r => r.map(w => w / NB));
const sum = a => a.reduce((s, v) => s + v, 0), mean = a => sum(a) / a.length;
const argmax = a => a.reduce((b, v, i) => (v > a[b] ? i : b), 0);
const argmin = a => a.reduce((b, v, i) => (v < a[b] ? i : b), 0);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const f2 = v => v.toFixed(2), f3 = v => v.toFixed(3), pct = v => Math.round(v * 100) + '%';
const int = n => Math.round(n).toLocaleString('en-US');
const pts = d => (d >= 0 ? '+' : '−') + Math.abs(d * 100).toFixed(1) + ' points';
const RM = M.map(mean);                                  // MB522's average against all 90 of their plans
const CM = M[0].map((_, j) => mean(M.map(r => r[j])));   // MB522's average against their plan j
const dense = s => { const a = Array(90).fill(0); for (const k in s) a[+k] = s[k]; return a; };
const X = dense(P.eq.x), Y = dense(P.eq.y), V = P.eq.value, RANDOM = mean(RM);
const UNI = Array(90).fill(1 / 90);
const homeOf = p => [0, 1, 2, 3, 4, 5].filter(k => !p.lead.includes(k) && !p.back.includes(k));
const nm = (side, ks) => ks.map(k => T[side][k].name).join(' + ');
const planName = (side, i) => { const p = PL[side][i]; return `${nm(side, p.lead)} lead, ${nm(side, p.back)} back`; };
const colMax = j => { let b = 0; for (let i = 1; i < 90; i++) if (Wm[i][j] > Wm[b][j]) b = i; return b; };
const sk = a => [...a].sort((x, y) => x - y).join('');
const groupBy = (side, keyFn) => { const g = new Map(); PL[side].forEach((p, i) => { const k = keyFn(p); if (!g.has(k)) g.set(k, []); g.get(k).push(i); }); return [...g.entries()]; };
const GRID = { you: groupBy('you', p => sk(p.lead)).map(e => e[1]), them: groupBy('them', p => sk(p.lead)).map(e => e[1]) };
const BYNAME = side => [...Array(90).keys()].sort((a, b) => planName(side, a).localeCompare(planName(side, b)));
const WIN = "Win rate = MB522's share of the 24 battles in a square: the preview is forced to that pair of plans, then the behaviour-cloning policy plays both sides.";

// ---------- colour + canvas ----------
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const palette = () => Object.fromEntries(['you', 'them', 'back', 'cell', 'ink', 'bg', 'panel', 'muted', 'faint', 'rule'].map(n => [n, hex(cssVar('--' + n))]));
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const PAL = palette();
const rate = (p, a = 1) => { const t = clamp((p - 0.5) / 0.35, -1, 1); return rgba(t >= 0 ? mix(PAL.cell, PAL.you, t) : mix(PAL.cell, PAL.them, -t), a); };
function useCanvas(w, h, draw, deps) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);

  }, deps);

}
const local = (e, w, h) => { const r = e.currentTarget.getBoundingClientRect(); return [(e.clientX - r.left) * w / r.width, (e.clientY - r.top) * h / r.height]; };
function drawBoard(ctx, val, x0, y0, size) {
  const c = size / 90;
  for (let i = 0; i < 90; i++) for (let j = 0; j < 90; j++) {
    const v = val(i, j);
    ctx.fillStyle = v == null ? rgba(PAL.cell) : rate(v);
    ctx.fillRect(x0 + j * c, y0 + i * c, c + 0.5, c + 0.5);
  }
}

// ---------- shared pieces ----------
function Mon({ side, k, size = 32, cls = '' }) {
  const m = T[side][k];
  return html`<img class="sp ${cls}" src=${m.sprite} alt=${m.name} title=${m.name} width=${size} height=${size} />`;
}
function Six({ side, size = 32, dim = [] }) {
  return html`<span class="six">${T[side].map((m, k) => html`<${Mon} side=${side} k=${k} size=${size} cls=${dim.includes(k) ? 'dim' : ''} />`)}</span>`;
}
function Plan({ side, p, size = 30, home = false, labels = false }) {
  const pl = PL[side][p], b = Math.round(size * 0.74), h = Math.round(size * 0.6);

// ================= C — Mind-reading chase =================
function chaseFrom(start) {
  const th = [{ who: 'you', plan: start, vs: null, wins: null }], seen = new Map();
  let i = start;
  for (;;) {
    const j = argmin(Wm[i]), key = i * 90 + j;
    if (seen.has(key)) return { th, loopFrom: seen.get(key) };
    seen.set(key, th.length);
    th.push({ who: 'them', plan: j, vs: i, wins: Wm[i][j] });
    const i2 = colMax(j);
    th.push({ who: 'you', plan: i2, vs: j, wins: Wm[i2][j] });
    i = i2;
  }
}

        <button type="button" onClick=${() => { setProbes([]); setPick(null); setLifted(false); }}>Reset</button></div>
    </div>
    <canvas ref=${ref} style=${`max-width:${S}px;margin-inline:auto;cursor:crosshair`} aria-label="The fogged 90 by 90 board"
      onClick=${click} onPointerMove=${e => setHover(cell(e))} onPointerLeave=${() => setHover(null)}></canvas>
    ${hover && html`<div class="row note"><${Plan} side="you" p=${hover[0]} size=${20} /><span>vs</span><${Plan} side="them" p=${hover[1]} size=${20} />
      <span>${lifted || probed.has(hover[0] * 90 + hover[1]) ? html`MB522 won <b class="num">${Wm[hover[0]][hover[1]]} of 24</b>` : 'fogged'}</span></div>`}
    ${probes.length > 0 && html`<div class="probelog"><p class="lab">Your probes, newest first</p>
      ${probes.slice().reverse().map(([i, j], n) => html`<div class="row note"><span class="num">#${probes.length - n}</span>
        <${Plan} side="you" p=${i} size=${18} /><span>vs</span><${Plan} side="them" p=${j} size=${18} />
        <b class="num chip" style=${`background:${rate(M[i][j], 0.6)}`}>${Wm[i][j]} of 24</b>
        ${!lifted && html`<button type="button" aria-pressed=${pick === i} onClick=${() => setPick(i)}>${pick === i ? 'Your plan' : 'Pick this plan'}</button>`}</div>`)}</div>`}
    ${pick != null && html`<div class="row"><span class="lab">Your plan</span><${Plan} side="you" p=${pick} size=${26} /></div>`}
    ${lifted && html`<div class="readouts">
      <div><span class="lab">Your plan, average</span><span class="big">${f3(RM[pick])}</span></div>
      <div><span class="lab">Its worst square</span><span class="big">${Math.min(...Wm[pick])} of 24</span></div>
      <div><span class="lab">The spinner guarantees</span><span class="big">${f3(V)}</span></div>
      <div><span class="lab">Best plan on average</span><span class="big">${f3(RM[best])}</span></div>
    </div>`}
  <//>`;
}

// ================= Shell + prototype switcher =================
const VARIANTS = [
  ['A', 'Matryoshka', VariantA], ['B', 'Jenga', VariantB], ['C', 'Mind-reading chase', VariantC], ['D', 'Loaded spinner', VariantD],
  ['E', 'Thinking makes MB522 worse', VariantE], ['F', 'Periscope', VariantF], ['G', 'Album-cover ridgelines', VariantG],
  ['H', 'String art', VariantH], ['I', 'Times table', VariantI], ['J', 'Sieve', VariantJ], ['K', 'Three chairs', VariantK],
  ['L', 'Guess Who?', VariantL], ['M', 'Sand timer', VariantM], ['N', 'Minesweeper', VariantN],
];
const q = new URLSearchParams(location.search);
function App() {
  const [variant, setVariant] = useState(VARIANTS.some(v => v[0] === q.get('variant')) ? q.get('variant') : 'A');
  const [showState, setShowState] = useState(false);
  const [vstate, setVstate] = useState({});
  const report = useCallback(s => setVstate(s), []);
  useEffect(() => {
    try { const u = new URLSearchParams(location.search); u.set('variant', variant); if (variant !== 'A') u.delete('probe'); history.replaceState(null, '', '?' + u); } catch (e) { /* file:// may refuse */ }
    window.scrollTo(0, 0);
  }, [variant]);
  const cycle = d => setVariant(v => VARIANTS[(VARIANTS.findIndex(x => x[0] === v) + d + VARIANTS.length) % VARIANTS.length][0]);
  useEffect(() => {
    const k = e => {
      const t = document.activeElement;
      if (t && t.matches('input,textarea,select,[contenteditable],[data-arrows]')) return;
      if (e.key === 'ArrowLeft') cycle(-1);
      if (e.key === 'ArrowRight') cycle(1);
    };
    addEventListener('keydown', k);
    return () => removeEventListener('keydown', k);
  }, []);
  const idx = VARIANTS.findIndex(x => x[0] === variant), [key, name, View] = VARIANTS[idx];
  return html`<main class="page">
      <p class="proto lab">Prototype · stage 2 of 5 · layout and state only, no motion</p>
      <h1>Team preview is a game</h1>
      <p class="dek">Fourteen candidate figures for the team-preview section. All of them use one real matchup: 8,100 pairs of preview plans, 24 battles each.</p>
      <div class="byline">
        <div><b>You</b><${Six} side="you" size=${28} /><span>MB522</span></div>
        <div><b>Opponent</b><${Six} side="them" size=${28} /><span>MB763, winner of Talon's Fight Club #98</span></div>
        <div><b>Battles</b><span>194,400: the preview is forced,<br />then the behaviour-cloning policy plays both sides</span></div>
      </div>
      <${View} key=${key} report=${report} />
    </main>
    <nav class="switcher" aria-label="Prototype variant switcher">
      <button type="button" onClick=${() => cycle(-1)} aria-label="Previous variant">←</button>
      <span class="lab">${key} — ${name} (${idx + 1}/${VARIANTS.length})</span>
      <button type="button" onClick=${() => cycle(1)} aria-label="Next variant">→</button>
      <button type="button" class="st" onClick=${() => setShowState(s => !s)}>${showState ? 'Hide state' : 'State'}</button>
    </nav>
    ${showState && html`<pre class="state">${JSON.stringify({ variant: `${key} — ${name}`, ...vstate }, null, 2)}</pre>`}`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
