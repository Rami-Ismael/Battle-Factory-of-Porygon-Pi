<svg width="800" height="830" viewBox="0 0 800 830" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>The rerun battled every team against all 50 meta files with slot order shuffled. From 24 meta teams, one edit moves win rate by 5.90 points for a whole Pokemon swap, 4.84 for a move, 4.35 for an item, 3.66 for an ability, 1.95 for stat alignment and 1.60 for Stat Points. Only the whole Pokemon swap passes both tests, from both groups of starting teams.</title><text x="16.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="650">Swapping a whole Pokemon is the one edit that clears both tests</text><rect x="16.0" y="63.6" width="376.0" height="330.4" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">1. Why it ran again, and what changed</text><rect x="30.0" y="105.6" width="168.0" height="176.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="38.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">September study</text><text x="38.0" y="145.4" font-size="10.5" fill="#52514e" text-anchor="start">Opponents: 36 of the 50</text><text x="38.0" y="160.1" font-size="10.5" fill="#52514e" text-anchor="start">meta files</text><text x="38.0" y="177.8" font-size="10.5" fill="#52514e" text-anchor="start">Slot order: as listed,</text><text x="38.0" y="192.5" font-size="10.5" fill="#52514e" text-anchor="start">which biases scores</text><text x="38.0" y="210.2" font-size="10.5" fill="#52514e" text-anchor="start">24 meta starting teams</text><text x="38.0" y="227.9" font-size="10.5" fill="#52514e" text-anchor="start">These battles no longer</text><text x="38.0" y="242.6" font-size="10.5" fill="#52514e" text-anchor="start">count</text><rect x="210.0" y="105.6" width="168.0" height="176.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="218.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Rerun, 2026-11-12</text><text x="218.0" y="145.4" font-size="10.5" fill="#52514e" text-anchor="start">Opponents: all 50 files, 49</text><text x="218.0" y="160.1" font-size="10.5" fill="#52514e" text-anchor="start">distinct teams</text><text x="218.0" y="177.8" font-size="10.5" fill="#52514e" text-anchor="start">Slot order: shuffled every</text><text x="218.0" y="192.5" font-size="10.5" fill="#52514e" text-anchor="start">battle</text><text x="218.0" y="210.2" font-size="10.5" fill="#52514e" text-anchor="start">24 meta starting teams, a</text><text x="218.0" y="224.9" font-size="10.5" fill="#52514e" text-anchor="start">fresh draw</text><text x="218.0" y="242.6" font-size="10.5" fill="#52514e" text-anchor="start">Same edit kinds, tests and</text><text x="218.0" y="257.3" font-size="10.5" fill="#52514e" text-anchor="start">cutoffs</text><text x="30" y="306.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> The rerun fixes the opponents and the slot</text><text x="30.0" y="322.0" font-size="11.5" fill="#52514e" text-anchor="start">order, and keeps every test as it was.</text><text x="30" y="342.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> The 24 meta starting teams came out as a fresh</text><text x="30.0" y="358.0" font-size="11.5" fill="#52514e" text-anchor="start">draw, 2 shared with September, so the two runs are not</text><text x="30.0" y="374.0" font-size="11.5" fill="#52514e" text-anchor="start">paired.</text><rect x="408.0" y="63.6" width="376.0" height="330.4" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">2. How one edit is scored</text><rect x="422.0" y="115.6" width="76.5" height="141.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="430.0" y="137.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Starting</text><text x="430.0" y="154.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">team</text><text x="430.0" y="175.2" font-size="10.5" fill="#52514e" text-anchor="start">24 meta,</text><text x="430.0" y="189.9" font-size="10.5" fill="#52514e" text-anchor="start">16</text><text x="430.0" y="204.6" font-size="10.5" fill="#52514e" text-anchor="start">search-found</text><text x="505.5" y="190.2" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="512.5" y="115.6" width="76.5" height="141.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5"/><text x="520.5" y="137.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">One edit</text><text x="520.5" y="158.4" font-size="10.5" fill="#2a78d6" text-anchor="start">6 kinds, 3</text><text x="520.5" y="173.1" font-size="10.5" fill="#2a78d6" text-anchor="start">edits each</text><text x="596.0" y="190.2" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="603.0" y="115.6" width="76.5" height="141.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#14946a" stroke-width="1.5"/><text x="611.0" y="137.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">384</text><text x="611.0" y="154.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">battles</text><text x="611.0" y="171.2" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">each</text><text x="611.0" y="192.0" font-size="10.5" fill="#14946a" text-anchor="start">Old team,</text><text x="611.0" y="206.7" font-size="10.5" fill="#14946a" text-anchor="start">new team,</text><text x="611.0" y="221.4" font-size="10.5" fill="#14946a" text-anchor="start">3 replays</text><text x="686.5" y="190.2" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="693.5" y="115.6" width="76.5" height="141.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#16803c" stroke-width="1.5"/><text x="701.5" y="137.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Change,</text><text x="701.5" y="154.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">in</text><text x="701.5" y="171.2" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">points</text><text x="701.5" y="192.0" font-size="10.5" fill="#16803c" text-anchor="start">Edit</text><text x="701.5" y="206.7" font-size="10.5" fill="#16803c" text-anchor="start">against</text><text x="701.5" y="221.4" font-size="10.5" fill="#16803c" text-anchor="start">replay</text><text x="701.5" y="236.1" font-size="10.5" fill="#16803c" text-anchor="start">noise</text><text x="422" y="290.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Each edited team is battled like its</text><text x="422.0" y="306.8" font-size="11.5" fill="#52514e" text-anchor="start">starting team, and replays show what noise alone does.</text><text x="422" y="326.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> 40 teams, each scored with its 18 edits and 3</text><text x="422.0" y="342.8" font-size="11.5" fill="#52514e" text-anchor="start">replays: 880 scores of 384 battles, 337,920 in all.</text><rect x="16.0" y="410.0" width="376.0" height="404.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="436.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">3. Typical size of one edit&#x27;s win-rate change,</text><text x="30.0" y="454.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">from meta teams</text><path d="M30 578.0H378" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/><rect x="43.0" y="499.0" width="31.9" height="79.0" rx="2" fill="#16803c" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="59.0" y="494.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">5.90</text><text x="59.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">Whole</text><text x="59.0" y="602.0" font-size="10" fill="#52514e" text-anchor="middle">Pokemon</text><rect x="101.0" y="513.1" width="31.9" height="64.9" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="117.0" y="508.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">4.84</text><text x="117.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">One move</text><rect x="159.1" y="519.7" width="31.9" height="58.3" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="175.0" y="514.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">4.35</text><text x="175.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">Held item</text><rect x="217.1" y="529.1" width="31.9" height="48.9" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="233.0" y="524.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">3.66</text><text x="233.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">Ability</text><rect x="275.1" y="551.7" width="31.9" height="26.3" rx="2" fill="#52514e" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="291.0" y="546.7" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">1.95</text><text x="291.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">Stat</text><text x="291.0" y="602.0" font-size="10" fill="#52514e" text-anchor="middle">alignment</text><rect x="333.1" y="556.4" width="31.9" height="21.6" rx="2" fill="#52514e" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="349.0" y="551.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">1.60</text><text x="349.0" y="590.0" font-size="10" fill="#52514e" text-anchor="middle">Stat</text><text x="349.0" y="602.0" font-size="10" fill="#52514e" text-anchor="middle">Points</text><path d="M30 511.26H378" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="290.2" y="496.3" width="87.8" height="13.0" rx="3" fill="#f3f2ee" fill-opacity="0.9" stroke="none" stroke-width="1"/><text x="374.0" y="506.3" font-size="10.5" fill="#52514e" text-anchor="end">5-point cutoff</text><text x="30" y="636.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Only the whole Pokemon swap clears the</text><text x="30.0" y="652.0" font-size="11.5" fill="#52514e" text-anchor="start">5-point cutoff, and a move edit stops just under it.</text><text x="30" y="672.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> From search-found teams the whole Pokemon swap</text><text x="30.0" y="688.0" font-size="11.5" fill="#52514e" text-anchor="start">is 5.85 points and a move edit 4.92.</text><rect x="408.0" y="410.0" width="376.0" height="404.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="436.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">4. Which edit kinds pass which test</text><text x="567.5" y="460.0" font-size="10.5" fill="#52514e" text-anchor="middle">Beyond battle noise</text><text x="702.5" y="460.0" font-size="10.5" fill="#52514e" text-anchor="middle">Rougher than Pest</text><text x="702.5" y="472.6" font-size="10.5" fill="#52514e" text-anchor="middle">Control</text><text x="422.0" y="497.0" font-size="10.5" fill="#52514e" text-anchor="start">Whole</text><text x="422.0" y="511.7" font-size="10.5" fill="#52514e" text-anchor="start">Pokemon</text><rect x="502.0" y="484.0" width="131.0" height="30.0" rx="6" fill="#16803c" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="503.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Passes, both groups</text><rect x="637.0" y="484.0" width="131.0" height="30.0" rx="6" fill="#16803c" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="503.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Passes, both groups</text><text x="422.0" y="531.0" font-size="10.5" fill="#52514e" text-anchor="start">One move</text><rect x="502.0" y="518.0" width="131.0" height="30.0" rx="6" fill="#a16207" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="529.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Misses on size</text><text x="567.5" y="544.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">alone</text><rect x="637.0" y="518.0" width="131.0" height="30.0" rx="6" fill="#16803c" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="537.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Passes, both groups</text><text x="422.0" y="565.0" font-size="10.5" fill="#52514e" text-anchor="start">Held item</text><rect x="502.0" y="552.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="571.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><rect x="637.0" y="552.0" width="131.0" height="30.0" rx="6" fill="#a16207" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="571.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Meta teams only</text><text x="422.0" y="599.0" font-size="10.5" fill="#52514e" text-anchor="start">Ability</text><rect x="502.0" y="586.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="605.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><rect x="637.0" y="586.0" width="131.0" height="30.0" rx="6" fill="#a16207" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="605.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Meta teams only</text><text x="422.0" y="633.0" font-size="10.5" fill="#52514e" text-anchor="start">Stat</text><text x="422.0" y="647.7" font-size="10.5" fill="#52514e" text-anchor="start">alignment</text><rect x="502.0" y="620.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="639.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><rect x="637.0" y="620.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="639.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><text x="422.0" y="667.0" font-size="10.5" fill="#52514e" text-anchor="start">Stat Points</text><rect x="502.0" y="654.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="567.5" y="673.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><rect x="637.0" y="654.0" width="131.0" height="30.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="702.5" y="673.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Fails</text><text x="422" y="710.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> One edit kind passes both tests, and three</text><text x="422.0" y="726.0" font-size="11.5" fill="#52514e" text-anchor="start">more are rougher than the benchmark from at least one</text><text x="422.0" y="742.0" font-size="11.5" fill="#52514e" text-anchor="start">group.</text><text x="422" y="762.0" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> September reached this verdict too, on battles</text><text x="422.0" y="778.0" font-size="11.5" fill="#52514e" text-anchor="start">that no longer count. The change ignores direction, so a</text><text x="422.0" y="794.0" font-size="11.5" fill="#52514e" text-anchor="start">large one can be harmful.</text></svg>