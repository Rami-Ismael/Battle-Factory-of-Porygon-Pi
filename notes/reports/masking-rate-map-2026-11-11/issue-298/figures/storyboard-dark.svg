<svg width="800" height="781" viewBox="0 0 800 781" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Each battled row gets a verdict at guidance 2, 4 and 8. A linear row that wins at two or more of them, and loses at none, becomes the candidate to replace the default model. A win under 0.002 is treated as training luck and can earn a second training seed. If no row wins, the three tested departures stay as ours.</title><text x="16.0" y="34.0" font-size="16" fill="#f2f1ee" text-anchor="start" font-weight="650">The results either name a new default model or keep our three departures</text><rect x="16.0" y="63.6" width="376.0" height="320.5" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">1. From the results to the owner&#x27;s decision</text><rect x="30.0" y="115.6" width="106.7" height="126.5" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#3a3a35" stroke-width="1"/><text x="38.0" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Results table</text><text x="38.0" y="158.4" font-size="10.5" fill="#a9a8a2" text-anchor="start">Error and win</text><text x="38.0" y="173.1" font-size="10.5" fill="#a9a8a2" text-anchor="start">rate per row</text><text x="143.7" y="182.8" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="150.7" y="115.6" width="106.7" height="126.5" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#5b9bf0" stroke-width="1.5"/><text x="158.7" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Verdict at</text><text x="158.7" y="154.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">each guidance</text><text x="158.7" y="171.2" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">value</text><text x="158.7" y="192.0" font-size="10.5" fill="#5b9bf0" text-anchor="start">Wins, matches or</text><text x="158.7" y="206.7" font-size="10.5" fill="#5b9bf0" text-anchor="start">loses, at 2, 4</text><text x="158.7" y="221.4" font-size="10.5" fill="#5b9bf0" text-anchor="start">and 8</text><text x="264.3" y="182.8" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="271.3" y="115.6" width="106.7" height="126.5" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#4ade80" stroke-width="1.5"/><text x="279.3" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Owner&#x27;s</text><text x="279.3" y="154.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">decision</text><text x="279.3" y="175.2" font-size="10.5" fill="#4ade80" text-anchor="start">Default model,</text><text x="279.3" y="189.9" font-size="10.5" fill="#4ade80" text-anchor="start">or a second</text><text x="279.3" y="204.6" font-size="10.5" fill="#4ade80" text-anchor="start">training seed</text><text x="30" y="276.1" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Each new row gets one verdict at guidance</text><text x="30.0" y="292.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">2, 4 and 8, and the owner decides from them.</text><text x="30" y="312.1" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> Both linear rows match or lose, and the owner</text><text x="30.0" y="328.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">keeps our three departures.</text><text x="30" y="348.1" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> A linear row wins at two guidance values, and</text><text x="30.0" y="364.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">the owner picks a new default model.</text><rect x="408.0" y="63.6" width="376.0" height="320.5" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">2. Each verdict and what follows</text><text x="567.5" y="113.6" font-size="10.5" fill="#a9a8a2" text-anchor="middle">Rule</text><text x="702.5" y="113.6" font-size="10.5" fill="#a9a8a2" text-anchor="middle">What follows</text><text x="422.0" y="152.3" font-size="10.5" fill="#a9a8a2" text-anchor="start">Row wins</text><rect x="502.0" y="137.6" width="131.0" height="33.3" rx="6" fill="#1f1f1e" fill-opacity="1" stroke="#3a3a35" stroke-width="1"/><text x="567.5" y="143.3" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">Wins at two or more</text><text x="567.5" y="158.1" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">guidance values,</text><text x="567.5" y="173.0" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">loses at none</text><rect x="637.0" y="137.6" width="131.0" height="33.3" rx="6" fill="#4ade80" fill-opacity="0.2" stroke="#3a3a35" stroke-width="1"/><text x="702.5" y="143.3" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">Candidate to</text><text x="702.5" y="158.1" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">replace the default</text><text x="702.5" y="173.0" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">model</text><text x="422.0" y="189.6" font-size="10.5" fill="#a9a8a2" text-anchor="start">Row matches</text><rect x="502.0" y="174.9" width="131.0" height="33.3" rx="6" fill="#1f1f1e" fill-opacity="1" stroke="#3a3a35" stroke-width="1"/><text x="567.5" y="188.1" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">No loss, and fewer</text><text x="567.5" y="202.9" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">than two wins</text><rect x="637.0" y="174.9" width="131.0" height="33.3" rx="6" fill="#1f1f1e" fill-opacity="1" stroke="#3a3a35" stroke-width="1"/><text x="702.5" y="195.6" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">Not a candidate</text><text x="422.0" y="226.9" font-size="10.5" fill="#a9a8a2" text-anchor="start">Row loses</text><rect x="502.0" y="212.3" width="131.0" height="33.3" rx="6" fill="#1f1f1e" fill-opacity="1" stroke="#3a3a35" stroke-width="1"/><text x="567.5" y="225.4" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">Loses at one or</text><text x="567.5" y="240.3" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">more values</text><rect x="637.0" y="212.3" width="131.0" height="33.3" rx="6" fill="#1f1f1e" fill-opacity="1" stroke="#3a3a35" stroke-width="1"/><text x="702.5" y="232.9" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">Not a candidate</text><text x="422" y="271.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Only a row that wins at two or more</text><text x="422.0" y="287.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">guidance values can replace the default model.</text><text x="422" y="307.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> Matches and losses are the likely verdicts for</text><text x="422.0" y="323.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">both linear rows.</text><text x="422" y="343.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> One row wins at a single value, which is</text><text x="422.0" y="359.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">reported as weak and does not make it a candidate.</text><rect x="16.0" y="400.1" width="376.0" height="364.8" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="426.1" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">3. A win must clear training luck</text><path d="M30 550.1H378" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round"/><rect x="93.0" y="512.5" width="48.0" height="37.6" rx="2" fill="#5b9bf0" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="117.0" y="507.5" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">0.001</text><text x="117.0" y="562.1" font-size="10" fill="#a9a8a2" text-anchor="middle">Win needs</text><rect x="267.0" y="478.7" width="48.0" height="71.4" rx="2" fill="#5b9bf0" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="291.0" y="473.7" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">0.0019</text><text x="291.0" y="562.1" font-size="10" fill="#a9a8a2" text-anchor="middle">Training luck</text><path d="M30 474.90000000000003H378" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="313.0" y="459.9" width="65.0" height="13.0" rx="3" fill="#1f1f1e" fill-opacity="0.9" stroke="none" stroke-width="1"/><text x="374.0" y="469.9" font-size="10.5" fill="#a9a8a2" text-anchor="end">0.002 rule</text><text x="30" y="608.1" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> A linear win under 0.002 is reported as</text><text x="30.0" y="624.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">inside training luck and can earn a second training seed.</text><text x="30" y="644.1" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> Two trainings of one recipe have differed by up</text><text x="30.0" y="660.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">to 0.0019 in error.</text><rect x="408.0" y="400.1" width="376.0" height="364.8" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="426.1" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">4. Three departures tested here, three still</text><text x="422.0" y="444.1" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">to decide</text><text x="426.0" y="474.1" font-size="13" fill="#5b9bf0" text-anchor="start" font-weight="650">→</text><text x="446.0" y="474.1" font-size="11.5" fill="#f2f1ee" text-anchor="start">Masking rate: battled here, the linear rows</text><text x="426.0" y="495.2" font-size="13" fill="#5b9bf0" text-anchor="start" font-weight="650">→</text><text x="446.0" y="495.2" font-size="11.5" fill="#f2f1ee" text-anchor="start">Species-first order: battled here, against random</text><text x="446.0" y="511.3" font-size="11.5" fill="#f2f1ee" text-anchor="start">order</text><text x="426.0" y="532.4" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="650">‖</text><text x="446.0" y="532.4" font-size="11.5" fill="#f2f1ee" text-anchor="start">t told while sampling: decided by a check, which</text><text x="446.0" y="548.5" font-size="11.5" fill="#f2f1ee" text-anchor="start">read 0.008 against a bar of 0.01</text><text x="426.0" y="569.6" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="569.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">Legal filter inside the loss</text><text x="426.0" y="590.7" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="590.7" font-size="11.5" fill="#a9a8a2" text-anchor="start">Slot shuffling</text><text x="426.0" y="611.8" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="611.8" font-size="11.5" fill="#a9a8a2" text-anchor="start">Ask dropout: 0.15 of teams train with no ask</text><text x="422" y="656.9" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Three departures are tested by this map,</text><text x="422.0" y="672.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">and three more wait for the owner.</text><text x="422" y="692.9" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> The battled departures get a verdict, and the</text><text x="422.0" y="708.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">three others wait for the owner.</text><text x="422" y="728.9" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> The check on the new per-field model reaches</text><text x="422.0" y="744.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">0.01, and Per-field, corrected t is battled after all.</text></svg>