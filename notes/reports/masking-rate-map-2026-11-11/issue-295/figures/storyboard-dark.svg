<svg width="800" height="728" viewBox="0 0 800 728" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Five build items: two training arms, the corrected t option, the guidance setting, the ask-grid rows and random order. One part of the first is done: training already reads the shuffled-only table by default. Each item has one test.</title><text x="16.0" y="34.0" font-size="16" fill="#f2f1ee" text-anchor="start" font-weight="650">Five build items let the four rows run, and the default table is done</text><rect x="16.0" y="63.6" width="376.0" height="298.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">1. Train, sample, battle: where each build</text><text x="30.0" y="107.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">item sits</text><rect x="30.0" y="133.6" width="106.7" height="122.0" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#5b9bf0" stroke-width="1.5"/><text x="38.0" y="155.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Train</text><text x="38.0" y="176.4" font-size="10.5" fill="#5b9bf0" text-anchor="start">Item 1: two</text><text x="38.0" y="191.1" font-size="10.5" fill="#5b9bf0" text-anchor="start">training arms</text><text x="143.7" y="198.6" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="150.7" y="133.6" width="106.7" height="122.0" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#2dd4a4" stroke-width="1.5"/><text x="158.7" y="155.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Sample</text><text x="158.7" y="176.4" font-size="10.5" fill="#2dd4a4" text-anchor="start">Items 2 and 5:</text><text x="158.7" y="191.1" font-size="10.5" fill="#2dd4a4" text-anchor="start">corrected t,</text><text x="158.7" y="205.8" font-size="10.5" fill="#2dd4a4" text-anchor="start">random order</text><text x="264.3" y="198.6" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="271.3" y="133.6" width="106.7" height="122.0" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#f5c04a" stroke-width="1.5"/><text x="279.3" y="155.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Battle</text><text x="279.3" y="176.4" font-size="10.5" fill="#f5c04a" text-anchor="start">Items 3 and 4:</text><text x="279.3" y="191.1" font-size="10.5" fill="#f5c04a" text-anchor="start">guidance, ask</text><text x="279.3" y="205.8" font-size="10.5" fill="#f5c04a" text-anchor="start">grid</text><text x="30" y="289.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Each row goes through training, sampling</text><text x="30.0" y="305.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">and battles, and each step needs build items.</text><text x="30" y="325.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> One part of item 1 is done: the shuffled-only</text><text x="30.0" y="341.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">table is already the default training table.</text><rect x="408.0" y="63.6" width="376.0" height="298.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">2. Five build items and their state</text><text x="426.0" y="119.6" font-size="13" fill="#5b9bf0" text-anchor="start" font-weight="650">→</text><text x="446.0" y="119.6" font-size="11.5" fill="#f2f1ee" text-anchor="start">1. Two training arms. Done already: the</text><text x="446.0" y="135.7" font-size="11.5" fill="#f2f1ee" text-anchor="start">shuffled-only default table</text><text x="426.0" y="156.8" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="156.8" font-size="11.5" fill="#a9a8a2" text-anchor="start">2. Corrected t option in the sampler</text><text x="426.0" y="177.9" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="177.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">3. Guidance as a setting: 2, 4 and 8</text><text x="426.0" y="199.0" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="199.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">4. Ask-grid rows: code names, a check step and cells</text><text x="446.0" y="215.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">with no ask</text><text x="426.0" y="236.2" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="236.2" font-size="11.5" fill="#a9a8a2" text-anchor="start">5. Random order as a decoding arm</text><text x="422" y="281.3" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> The default table is in place, and the two</text><text x="422.0" y="297.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">training arms of item 1 come next.</text><text x="422" y="317.3" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> Done in commit b00a71ff: training reads the</text><text x="422.0" y="333.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">shuffled-only table unless --older-table is passed.</text><rect x="16.0" y="377.6" width="376.0" height="334.4" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="403.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">3. Code today against code after this ticket</text><rect x="30.0" y="419.6" width="168.0" height="176.4" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#3a3a35" stroke-width="1"/><text x="38.0" y="439.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Today</text><text x="38.0" y="459.4" font-size="10.5" fill="#a9a8a2" text-anchor="start">Guidance is fixed at 2</text><text x="38.0" y="477.1" font-size="10.5" fill="#a9a8a2" text-anchor="start">The sampler&#x27;s t is always 1</text><text x="38.0" y="491.8" font-size="10.5" fill="#a9a8a2" text-anchor="start">− filled/84</text><text x="38.0" y="509.5" font-size="10.5" fill="#a9a8a2" text-anchor="start">The check step samples</text><text x="38.0" y="524.2" font-size="10.5" fill="#a9a8a2" text-anchor="start">species-first only</text><text x="38.0" y="541.9" font-size="10.5" fill="#a9a8a2" text-anchor="start">Default early stopping</text><text x="38.0" y="556.6" font-size="10.5" fill="#a9a8a2" text-anchor="start">would end near epoch 47</text><rect x="210.0" y="419.6" width="168.0" height="176.4" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#5b9bf0" stroke-width="1.5"/><text x="218.0" y="439.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">After</text><text x="218.0" y="459.4" font-size="10.5" fill="#a9a8a2" text-anchor="start">Guidance is a setting: 2, 4</text><text x="218.0" y="474.1" font-size="10.5" fill="#a9a8a2" text-anchor="start">and 8</text><text x="218.0" y="491.8" font-size="10.5" fill="#a9a8a2" text-anchor="start">The corrected t is an</text><text x="218.0" y="506.5" font-size="10.5" fill="#a9a8a2" text-anchor="start">option</text><text x="218.0" y="524.2" font-size="10.5" fill="#a9a8a2" text-anchor="start">Each row samples with its</text><text x="218.0" y="538.9" font-size="10.5" fill="#a9a8a2" text-anchor="start">own decoder</text><text x="218.0" y="556.6" font-size="10.5" fill="#a9a8a2" text-anchor="start">Both arms pass</text><text x="218.0" y="571.3" font-size="10.5" fill="#a9a8a2" text-anchor="start">early-stopping threshold 0</text><text x="30" y="620.0" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Four fixed behaviours become settings, and</text><text x="30.0" y="636.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">today&#x27;s behaviour stays the default.</text><text x="30" y="656.0" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> Stored runs reproduce unchanged, because every</text><text x="30.0" y="672.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">new setting defaults to today&#x27;s behaviour.</text><text x="30" y="692.0" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> A stored result changes under the new code.</text><rect x="408.0" y="377.6" width="376.0" height="334.4" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="403.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">4. What each test proves</text><text x="426.0" y="433.6" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="433.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">Training arms: under the linear rate, the share</text><text x="446.0" y="449.7" font-size="11.5" fill="#a9a8a2" text-anchor="start">hidden at t is t</text><text x="426.0" y="470.8" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="470.8" font-size="11.5" fill="#a9a8a2" text-anchor="start">Corrected t: matches the check script&#x27;s value at</text><text x="446.0" y="486.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">every pass</text><text x="426.0" y="508.0" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="508.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">Guidance: guidance 2 reproduces a stored cell</text><text x="426.0" y="529.1" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="529.1" font-size="11.5" fill="#a9a8a2" text-anchor="start">Ask-grid rows: each code name loads its checkpoint</text><text x="446.0" y="545.2" font-size="11.5" fill="#a9a8a2" text-anchor="start">and decoder</text><text x="426.0" y="566.3" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="566.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">Random order: the existing lookahead tests pass</text><text x="422" y="611.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Each build item has one test that checks</text><text x="422.0" y="627.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">the one thing it must do.</text><text x="422" y="647.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> All five pass before any training starts.</text><text x="422" y="667.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> Guidance 2 fails to reproduce a stored cell, so</text><text x="422.0" y="683.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">the new setting changed old behaviour.</text></svg>