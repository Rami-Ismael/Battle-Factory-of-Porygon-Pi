<svg width="800" height="714" viewBox="0 0 800 714" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Nothing has run yet. Three tickets are closed and the code ticket is next. Four rows are compared, two trainings and nine grids will answer, and a row wins when its error is at least 0.001 lower at two or more guidance values.</title><text x="16.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="650">Do the papers&#x27; masking settings beat ours on the 84-field model?</text><rect x="16.0" y="63.6" width="376.0" height="317.7" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">1. Where the map stands: the code ticket is</text><text x="30.0" y="107.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">next</text><text x="34.0" y="137.6" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="137.6" font-size="11.5" fill="#0b0b0b" text-anchor="start">Departures from the papers</text><text x="34.0" y="158.7" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="158.7" font-size="11.5" fill="#0b0b0b" text-anchor="start">Corrected t</text><text x="34.0" y="179.8" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="179.8" font-size="11.5" fill="#0b0b0b" text-anchor="start">Pre-register the four rows</text><text x="34.0" y="200.9" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="650">→</text><text x="54.0" y="200.9" font-size="11.5" fill="#0b0b0b" text-anchor="start">Code for the four rows</text><text x="34.0" y="222.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="650">○</text><text x="54.0" y="222.0" font-size="11.5" fill="#52514e" text-anchor="start">Train both models</text><text x="34.0" y="243.1" font-size="13" fill="#52514e" text-anchor="start" font-weight="650">○</text><text x="54.0" y="243.1" font-size="11.5" fill="#52514e" text-anchor="start">Sample and battle</text><text x="34.0" y="264.2" font-size="13" fill="#52514e" text-anchor="start" font-weight="650">○</text><text x="54.0" y="264.2" font-size="11.5" fill="#52514e" text-anchor="start">Results and diagnosis</text><text x="30" y="309.3" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Three tickets are closed and the code</text><text x="30.0" y="325.3" font-size="11.5" fill="#52514e" text-anchor="start">ticket is next, before any training.</text><text x="30" y="345.3" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> No training or battle has run; the three closed</text><text x="30.0" y="361.3" font-size="11.5" fill="#52514e" text-anchor="start">tickets only fixed the plan.</text><rect x="408.0" y="63.6" width="376.0" height="317.7" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">2. Four rows: masking rate by decoding setting</text><text x="545.0" y="113.6" font-size="10.5" fill="#52514e" text-anchor="middle">Species-first,</text><text x="545.0" y="126.2" font-size="10.5" fill="#52514e" text-anchor="middle">uncorrected t</text><text x="635.0" y="113.6" font-size="10.5" fill="#52514e" text-anchor="middle">Species-first,</text><text x="635.0" y="126.2" font-size="10.5" fill="#52514e" text-anchor="middle">corrected t</text><text x="725.0" y="113.6" font-size="10.5" fill="#52514e" text-anchor="middle">Random order</text><text x="422.0" y="161.6" font-size="10.5" fill="#52514e" text-anchor="start">Per-field</text><text x="422.0" y="176.3" font-size="10.5" fill="#52514e" text-anchor="start">masking rate</text><rect x="502.0" y="137.6" width="86.0" height="52.0" rx="6" fill="#f3f2ee" fill-opacity="1" stroke="#d5d4cd" stroke-width="1"/><text x="545.0" y="152.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Per-field,</text><text x="545.0" y="167.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">uncorrected</text><text x="545.0" y="182.3" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">t</text><rect x="592.0" y="137.6" width="86.0" height="52.0" rx="6" fill="#b07800" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="635.0" y="160.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Per-field,</text><text x="635.0" y="174.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">corrected t</text><rect x="682.0" y="137.6" width="86.0" height="52.0" rx="6" fill="#c0392b" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="725.0" y="152.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Not a row:</text><text x="725.0" y="167.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">already</text><text x="725.0" y="182.3" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">failed</text><text x="422.0" y="217.6" font-size="10.5" fill="#52514e" text-anchor="start">Linear</text><text x="422.0" y="232.3" font-size="10.5" fill="#52514e" text-anchor="start">masking rate</text><rect x="502.0" y="193.6" width="86.0" height="52.0" rx="6" fill="#2a78d6" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="545.0" y="216.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Linear,</text><text x="545.0" y="230.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">species-first</text><rect x="592.0" y="193.6" width="86.0" height="52.0" rx="6" fill="#f3f2ee" fill-opacity="1" stroke="#d5d4cd" stroke-width="1"/><text x="635.0" y="208.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Not needed:</text><text x="635.0" y="223.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">t already</text><text x="635.0" y="238.3" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">matches</text><rect x="682.0" y="193.6" width="86.0" height="52.0" rx="6" fill="#14946a" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="725.0" y="216.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Linear,</text><text x="725.0" y="230.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">random order</text><text x="422" y="271.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Four rows: two masking rates, each with two</text><text x="422.0" y="287.6" font-size="11.5" fill="#52514e" text-anchor="start">ways of decoding. Per-field, corrected t is battled only</text><text x="422.0" y="303.6" font-size="11.5" fill="#52514e" text-anchor="start">if the t check says so.</text><text x="422" y="323.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> Linear, species-first matches the control</text><text x="422.0" y="339.6" font-size="11.5" fill="#52514e" text-anchor="start">within training luck. Linear, random order loses to it.</text><text x="422" y="359.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> A linear row wins by 0.002 or more.</text><rect x="16.0" y="397.3" width="376.0" height="300.4" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="423.3" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">3. The cost: one table, two trainings, nine</text><text x="30.0" y="441.3" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">grids</text><rect x="30.0" y="467.3" width="76.5" height="124.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="38.0" y="489.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Shuffled-only</text><text x="38.0" y="506.1" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">table</text><text x="38.0" y="526.9" font-size="10.5" fill="#52514e" text-anchor="start">218,978</text><text x="38.0" y="541.6" font-size="10.5" fill="#52514e" text-anchor="start">labelled</text><text x="38.0" y="556.3" font-size="10.5" fill="#52514e" text-anchor="start">teams</text><text x="113.5" y="533.5" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="120.5" y="467.3" width="76.5" height="124.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5"/><text x="128.5" y="489.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Two</text><text x="128.5" y="506.1" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">trainings</text><text x="128.5" y="526.9" font-size="10.5" fill="#2a78d6" text-anchor="start">About 6.7</text><text x="128.5" y="541.6" font-size="10.5" fill="#2a78d6" text-anchor="start">hours each</text><text x="204.0" y="533.5" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="211.0" y="467.3" width="76.5" height="124.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#14946a" stroke-width="1.5"/><text x="219.0" y="489.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Nine</text><text x="219.0" y="506.1" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">grids</text><text x="219.0" y="526.9" font-size="10.5" fill="#14946a" text-anchor="start">Three rows</text><text x="219.0" y="541.6" font-size="10.5" fill="#14946a" text-anchor="start">at</text><text x="219.0" y="556.3" font-size="10.5" fill="#14946a" text-anchor="start">guidance</text><text x="219.0" y="571.0" font-size="10.5" fill="#14946a" text-anchor="start">2, 4 and 8</text><text x="294.5" y="533.5" font-size="14" fill="#52514e" text-anchor="middle">→</text><rect x="301.5" y="467.3" width="76.5" height="124.4" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#16803c" stroke-width="1.5"/><text x="309.5" y="489.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Battles</text><text x="309.5" y="510.1" font-size="10.5" fill="#16803c" text-anchor="start">1.95</text><text x="309.5" y="524.8" font-size="10.5" fill="#16803c" text-anchor="start">million,</text><text x="309.5" y="539.5" font-size="10.5" fill="#16803c" text-anchor="start">about 6.9</text><text x="309.5" y="554.2" font-size="10.5" fill="#16803c" text-anchor="start">hours</text><text x="30" y="625.7" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Both trainings read one table, then nine</text><text x="30.0" y="641.7" font-size="11.5" fill="#52514e" text-anchor="start">grids are battled.</text><text x="30" y="661.7" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> Two trainings of about 6.7 hours each, then</text><text x="30.0" y="677.7" font-size="11.5" fill="#52514e" text-anchor="start">1.95 million battles, about 6.9 hours.</text><rect x="408.0" y="397.3" width="376.0" height="300.4" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="423.3" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">4. What a win looks like</text><rect x="422.0" y="439.3" width="168.0" height="142.0" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#16803c" stroke-width="1.5"/><text x="430.0" y="459.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">A win</text><text x="430.0" y="479.1" font-size="10.5" fill="#52514e" text-anchor="start">Error at least 0.001 lower</text><text x="430.0" y="493.8" font-size="10.5" fill="#52514e" text-anchor="start">than the control</text><text x="430.0" y="511.5" font-size="10.5" fill="#52514e" text-anchor="start">At two or more of guidance</text><text x="430.0" y="526.2" font-size="10.5" fill="#52514e" text-anchor="start">2, 4 and 8</text><text x="430.0" y="543.9" font-size="10.5" fill="#52514e" text-anchor="start">And a loss at none</text><rect x="602.0" y="439.3" width="168.0" height="142.0" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#a16207" stroke-width="1.5"/><text x="610.0" y="459.3" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Reported as a trade</text><text x="610.0" y="479.1" font-size="10.5" fill="#52514e" text-anchor="start">A win whose pooled win rate</text><text x="610.0" y="493.8" font-size="10.5" fill="#52514e" text-anchor="start">falls by more than 0.026</text><text x="610.0" y="511.5" font-size="10.5" fill="#52514e" text-anchor="start">Or whose line-ups fall</text><text x="422" y="605.3" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> A row wins when its error is clearly lower</text><text x="422.0" y="621.3" font-size="11.5" fill="#52514e" text-anchor="start">at two or more guidance values.</text><text x="422" y="641.3" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> Linear, species-first matches the control, and</text><text x="422.0" y="657.3" font-size="11.5" fill="#52514e" text-anchor="start">no row wins.</text><text x="422" y="677.3" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> A linear row wins at all three guidance values.</text></svg>