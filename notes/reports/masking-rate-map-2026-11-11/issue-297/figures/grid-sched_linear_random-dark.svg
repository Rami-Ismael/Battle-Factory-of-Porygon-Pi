<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 692" width="800" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Linear, random order at guidance 2 loses to the control: error 0.0358 against 0.0084</title><rect width="100%" height="100%" fill="#0d1117"/><text x="20.0" y="38.0" font-size="18" fill="#f2f1ee" text-anchor="start" font-weight="600">Linear, random order at guidance 2 loses to the control: error 0.0358</text><text x="20.0" y="62.0" font-size="18" fill="#f2f1ee" text-anchor="start" font-weight="600">against 0.0084</text><text x="20.0" y="86.0" font-size="12" fill="#a9a8a2" text-anchor="start">Results so far for the masking-rate rows. The thick border marks the grid that just finished.</text><text x="316.7" y="108.0" font-size="12" fill="#a9a8a2" text-anchor="middle" font-weight="600">guidance 2</text><text x="502.0" y="108.0" font-size="12" fill="#a9a8a2" text-anchor="middle" font-weight="600">guidance 4</text><text x="687.3" y="108.0" font-size="12" fill="#a9a8a2" text-anchor="middle" font-weight="600">guidance 8</text><text x="20.0" y="148.0" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="600">Per-field, uncorrected t</text><text x="20.0" y="166.0" font-size="11" fill="#a9a8a2" text-anchor="start">the control: our own settings</text><rect x="228.0" y="122.0" width="177.3" height="84.0" rx="6" fill="#1f1f1e" stroke="#5b9bf0" stroke-width="1.5"/><text x="316.7" y="154.0" font-size="22" fill="#f2f1ee" text-anchor="middle" font-weight="600">0.0084</text><text x="316.7" y="173.0" font-size="12" fill="#5b9bf0" text-anchor="middle" font-weight="600">the control</text><text x="316.7" y="191.0" font-size="11" fill="#a9a8a2" text-anchor="middle">1,513 line-ups · win 0.497</text><rect x="413.3" y="122.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="502.0" y="168.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><rect x="598.7" y="122.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="687.3" y="168.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><text x="20.0" y="240.0" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="600">Linear, species-first</text><text x="20.0" y="258.0" font-size="11" fill="#a9a8a2" text-anchor="start">the published masking rate, our</text><text x="20.0" y="272.0" font-size="11" fill="#a9a8a2" text-anchor="start">decoding order</text><rect x="228.0" y="214.0" width="177.3" height="84.0" rx="6" fill="#1f1f1e" stroke="#a9a8a2" stroke-width="1.5"/><text x="316.7" y="246.0" font-size="22" fill="#f2f1ee" text-anchor="middle" font-weight="600">0.0075</text><text x="316.7" y="265.0" font-size="12" fill="#a9a8a2" text-anchor="middle" font-weight="600">matches, -0.0008</text><text x="316.7" y="283.0" font-size="11" fill="#a9a8a2" text-anchor="middle">1,578 line-ups · win 0.503</text><rect x="413.3" y="214.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="502.0" y="260.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><rect x="598.7" y="214.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="687.3" y="260.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><text x="20.0" y="332.0" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="600">Linear, random order</text><text x="20.0" y="350.0" font-size="11" fill="#a9a8a2" text-anchor="start">the published masking rate and</text><text x="20.0" y="364.0" font-size="11" fill="#a9a8a2" text-anchor="start">decoding order</text><rect x="228.0" y="306.0" width="177.3" height="84.0" rx="6" fill="#1f1f1e" stroke="#f87171" stroke-width="3"/><text x="316.7" y="338.0" font-size="22" fill="#f2f1ee" text-anchor="middle" font-weight="600">0.0358</text><text x="316.7" y="357.0" font-size="12" fill="#f87171" text-anchor="middle" font-weight="600">loses, +0.0274</text><text x="316.7" y="375.0" font-size="11" fill="#a9a8a2" text-anchor="middle">2,646 line-ups · win 0.340</text><rect x="413.3" y="306.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="502.0" y="352.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><rect x="598.7" y="306.0" width="177.3" height="84.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="687.3" y="352.0" font-size="12" fill="#a9a8a2" text-anchor="middle">not run yet</text><text x="20.0" y="424.0" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="600">Per-field, corrected t</text><text x="20.0" y="442.0" font-size="11" fill="#a9a8a2" text-anchor="start">the control&#x27;s model, told another t</text><rect x="228.0" y="398.0" width="548.0" height="62.0" rx="6" fill="none" stroke="#3a3a35" stroke-width="1" stroke-dasharray="5 4"/><text x="242.0" y="420.0" font-size="12" fill="#a9a8a2" text-anchor="start">Not battled. Time t says how much of the team is hidden. Telling the model the t</text><text x="242.0" y="436.0" font-size="12" fill="#a9a8a2" text-anchor="start">its training used moved its drawing odds by 0.0078 at most, under the 0.01 bar</text><text x="242.0" y="452.0" font-size="12" fill="#a9a8a2" text-anchor="start">set beforehand.</text><text x="20.0" y="482.0" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="600">How to read this</text><text x="20.0" y="500.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">Big number: the ask-versus-got error. The ask is the win rate the model is told to aim for, and got is the win rate its</text><text x="20.0" y="515.5" font-size="11.5" fill="#a9a8a2" text-anchor="start">teams then score. The error is the mean squared gap between the two on asks 1/24 to 17/24. Lower is better.</text><text x="20.0" y="536.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">Row: one way to train and sample the model. Per-field and linear name the masking rate, the chance a field is hidden during</text><text x="20.0" y="551.5" font-size="11.5" fill="#a9a8a2" text-anchor="start">training: set by field type, or the same for every field. Species-first and random order name the order the sampler fills</text><text x="20.0" y="567.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">fields in.</text><text x="20.0" y="587.5" font-size="11.5" fill="#a9a8a2" text-anchor="start">Guidance: how hard the sampler pushes toward the ask. 1 is no push.</text><text x="20.0" y="608.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">Line-ups: distinct sets of six species among the grid&#x27;s teams. Win: mean win rate at asks 15/24 to 17/24, one battle against</text><text x="20.0" y="623.5" font-size="11.5" fill="#a9a8a2" text-anchor="start">each of the 49 distinct top-50 meta teams, slots shuffled.</text><text x="20.0" y="644.0" font-size="11.5" fill="#a9a8a2" text-anchor="start">Wins, matches, loses: against the control at the same guidance. A win needs an error at least 0.001 lower with the 95%</text><text x="20.0" y="659.5" font-size="11.5" fill="#a9a8a2" text-anchor="start">interval of the difference below zero. A loss needs that interval above zero.</text></svg>