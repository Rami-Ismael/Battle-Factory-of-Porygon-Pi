<svg width="800" height="771" viewBox="0 0 800 771" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Nothing has run yet. Each battled row becomes a curve of three points, one for each guidance value. A row wins when its ask-versus-got error is at least 0.001 lower than the control&#x27;s at two or more guidance values, and it loses at none.</title><text x="16.0" y="34.0" font-size="16" fill="#f2f1ee" text-anchor="start" font-weight="650">A row beats the control when its curve sits lower and further right</text><rect x="16.0" y="63.6" width="376.0" height="334.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">1. Error against line-ups, one curve for each</text><text x="30.0" y="107.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">row</text><path d="M56 129.6H70" fill="none" stroke="#a9a8a2" stroke-width="2.2" stroke-linejoin="round"/><text x="74.0" y="133.1" font-size="10.5" fill="#a9a8a2" text-anchor="start" font-weight="650">Per-field, uncorrected t</text><path d="M56 143.6H70" fill="none" stroke="#5b9bf0" stroke-width="2.2" stroke-linejoin="round"/><text x="74.0" y="147.1" font-size="10.5" fill="#5b9bf0" text-anchor="start" font-weight="650">Linear, species-first</text><path d="M214.1 143.6H228.1" fill="none" stroke="#2dd4a4" stroke-width="2.2" stroke-linejoin="round"/><text x="232.1" y="147.1" font-size="10.5" fill="#2dd4a4" text-anchor="start" font-weight="650">Linear, random order</text><path d="M56 159.6V245.60000000000002H372" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round"/><text x="214.0" y="262.6" font-size="10.5" fill="#a9a8a2" text-anchor="middle">line-ups →</text><text x="39" y="202.60000000000002" font-size="10.5" fill="#a9a8a2" text-anchor="middle" transform="rotate(-90 39 202.60000000000002)">error, lower is better</text><path d="M135.0 219.8L198.2 211.2L261.4 202.6" fill="none" stroke="#a9a8a2" stroke-width="2.2" stroke-linejoin="round"/><path d="M141.3 222.4L204.5 213.8L267.7 205.2" fill="none" stroke="#5b9bf0" stroke-width="2.2" stroke-linejoin="round"/><path d="M166.6 202.6L229.8 194.0L293.0 185.4" fill="none" stroke="#2dd4a4" stroke-width="2.2" stroke-linejoin="round"/><text x="30" y="289.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Each row is a three-point curve; the</text><text x="30.0" y="305.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">control&#x27;s curve is the line to beat.</text><text x="30" y="325.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> Linear, species-first sits on the control&#x27;s</text><text x="30.0" y="341.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">curve. Linear, random order sits further right but</text><text x="30.0" y="357.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">higher.</text><text x="30" y="377.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> A linear curve lies wholly below the control&#x27;s.</text><rect x="408.0" y="63.6" width="376.0" height="334.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">2. Got against ask for the control and Linear,</text><text x="422.0" y="107.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">species-first</text><path d="M448 129.6H462" fill="none" stroke="#a9a8a2" stroke-width="2.2" stroke-linejoin="round"/><text x="466.0" y="133.1" font-size="10.5" fill="#a9a8a2" text-anchor="start" font-weight="650">Per-field, uncorrected t</text><path d="M448 143.6H462" fill="none" stroke="#5b9bf0" stroke-width="2.2" stroke-linejoin="round"/><text x="466.0" y="147.1" font-size="10.5" fill="#5b9bf0" text-anchor="start" font-weight="650">Linear, species-first</text><path d="M448 159.6V245.60000000000002H764" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round"/><text x="606.0" y="262.6" font-size="10.5" fill="#a9a8a2" text-anchor="middle">ask →</text><text x="431" y="202.60000000000002" font-size="10.5" fill="#a9a8a2" text-anchor="middle" transform="rotate(-90 431 202.60000000000002)">got</text><path d="M448 245.60000000000002L764 159.6" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M463.8 243.0L527.0 226.7L606.0 206.9L685.0 198.3L748.2 194.0" fill="none" stroke="#a9a8a2" stroke-width="2.2" stroke-linejoin="round"/><path d="M463.8 243.0L527.0 226.7L606.0 205.2L685.0 195.7L748.2 191.4" fill="none" stroke="#5b9bf0" stroke-width="2.2" stroke-linejoin="round"/><text x="422" y="289.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Got should follow ask; a line short of the</text><text x="422.0" y="305.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">dashed diagonal misses it.</text><text x="422" y="325.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> Both lines overlap and stop rising at the same</text><text x="422.0" y="341.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">got.</text><text x="422" y="361.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> The linear line keeps rising after the control</text><text x="422.0" y="377.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">line stops.</text><rect x="16.0" y="413.6" width="376.0" height="341.7" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="439.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">3. Random order&#x27;s error as a multiple of</text><text x="30.0" y="457.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">species-first&#x27;s</text><path d="M30 581.6H378" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round"/><rect x="93.0" y="506.4" width="48.0" height="75.2" rx="2" fill="#a9a8a2" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="117.0" y="501.4" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">2.8, measured</text><text x="117.0" y="593.6" font-size="10" fill="#a9a8a2" text-anchor="middle">Per-field model</text><rect x="267.0" y="539.3" width="48.0" height="42.3" rx="2" fill="none" fill-opacity="1.0" stroke="#2dd4a4" stroke-width="1.5" stroke-dasharray="4 3"/><text x="291.0" y="534.3" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">?</text><text x="291.0" y="593.6" font-size="10" fill="#a9a8a2" text-anchor="middle">Linear model</text><path d="M30 554.34H378" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="244.6" y="539.3" width="133.4" height="13.0" rx="3" fill="#1f1f1e" fill-opacity="0.9" stroke="none" stroke-width="1"/><text x="374.0" y="549.3" font-size="10.5" fill="#a9a8a2" text-anchor="end">equal to species-first</text><text x="30" y="639.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> On a per-field model, random order&#x27;s error</text><text x="30.0" y="655.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">was 2.8 times species-first&#x27;s. On the linear model it is</text><text x="30.0" y="671.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">unknown.</text><text x="30" y="691.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> On the linear model the multiple falls below</text><text x="30.0" y="707.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">2.8 but stays above 1.</text><text x="30" y="727.6" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> It stays near 2.8, or falls below 1.</text><rect x="408.0" y="413.6" width="376.0" height="341.7" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="439.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">4. When a row counts as winning</text><text x="426.0" y="469.6" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="469.6" font-size="11.5" fill="#a9a8a2" text-anchor="start">Win at one guidance value: error at least 0.001</text><text x="446.0" y="485.7" font-size="11.5" fill="#a9a8a2" text-anchor="start">lower, interval below zero</text><text x="426.0" y="506.8" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="506.8" font-size="11.5" fill="#a9a8a2" text-anchor="start">Loss at one value: interval above zero</text><text x="426.0" y="527.9" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="527.9" font-size="11.5" fill="#a9a8a2" text-anchor="start">Match: anything else</text><text x="426.0" y="549.0" font-size="13" fill="#5b9bf0" text-anchor="start" font-weight="650">→</text><text x="446.0" y="549.0" font-size="11.5" fill="#f2f1ee" text-anchor="start">The row wins: a win at two or more values and a loss</text><text x="446.0" y="565.1" font-size="11.5" fill="#f2f1ee" text-anchor="start">at none</text><text x="426.0" y="586.2" font-size="13" fill="#a9a8a2" text-anchor="start" font-weight="650">○</text><text x="446.0" y="586.2" font-size="11.5" fill="#a9a8a2" text-anchor="start">One win in three: reported as weak</text><text x="422" y="631.3" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> A row wins when it wins at two or more</text><text x="422.0" y="647.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">guidance values and loses at none. A win needs an error</text><text x="422.0" y="663.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">at least 0.001 lower.</text><text x="422" y="683.3" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#4ade80">Expected:</tspan> A row that wins twice and matches once still</text><text x="422.0" y="699.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">counts as winning.</text><text x="422" y="719.3" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#fbbf24">Surprise:</tspan> A row that wins twice and loses once does not</text><text x="422.0" y="735.3" font-size="11.5" fill="#a9a8a2" text-anchor="start">count as winning.</text></svg>