<svg width="800" height="736" viewBox="0 0 800 736" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>The plan fixed four rows before any run. Five checks passed. The t check read 0.005 and 0.008, under its bar of 0.01, so Per-field, corrected t is battled only if the same check reaches the bar on the new model. The battles can detect a gap of 0.001, and training luck alone has reached 0.0019.</title><text x="16.0" y="34.0" font-size="16" fill="#f2f1ee" text-anchor="start" font-weight="650">The plan was fixed before any run, and one failed check now decides a row</text><rect x="16.0" y="63.6" width="376.0" height="326.8" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">1. The plan, from claim to budget</text><rect x="30.0" y="115.6" width="76.5" height="153.8" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#3a3a35" stroke-width="1"/><text x="38.0" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Claim</text><text x="38.0" y="158.4" font-size="10.5" fill="#a9a8a2" text-anchor="start">Do the</text><text x="38.0" y="173.1" font-size="10.5" fill="#a9a8a2" text-anchor="start">papers&#x27;</text><text x="38.0" y="187.8" font-size="10.5" fill="#a9a8a2" text-anchor="start">settings</text><text x="38.0" y="202.5" font-size="10.5" fill="#a9a8a2" text-anchor="start">do better?</text><text x="113.5" y="196.5" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="120.5" y="115.6" width="76.5" height="153.8" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#5b9bf0" stroke-width="1.5"/><text x="128.5" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Four</text><text x="128.5" y="154.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">rows</text><text x="128.5" y="175.2" font-size="10.5" fill="#5b9bf0" text-anchor="start">Fixed in</text><text x="128.5" y="189.9" font-size="10.5" fill="#5b9bf0" text-anchor="start">writing,</text><text x="128.5" y="204.6" font-size="10.5" fill="#5b9bf0" text-anchor="start">with their</text><text x="128.5" y="219.3" font-size="10.5" fill="#5b9bf0" text-anchor="start">settings</text><text x="128.5" y="234.0" font-size="10.5" fill="#5b9bf0" text-anchor="start">and cost</text><text x="204.0" y="196.5" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="211.0" y="115.6" width="76.5" height="153.8" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#fbbf24" stroke-width="1.5"/><text x="219.0" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Probes</text><text x="219.0" y="158.4" font-size="10.5" fill="#fbbf24" text-anchor="start">Checks</text><text x="219.0" y="173.1" font-size="10.5" fill="#fbbf24" text-anchor="start">with no</text><text x="219.0" y="187.8" font-size="10.5" fill="#fbbf24" text-anchor="start">battles.</text><text x="219.0" y="202.5" font-size="10.5" fill="#fbbf24" text-anchor="start">One</text><text x="219.0" y="217.2" font-size="10.5" fill="#fbbf24" text-anchor="start">failed.</text><text x="294.5" y="196.5" font-size="14" fill="#a9a8a2" text-anchor="middle">→</text><rect x="301.5" y="115.6" width="76.5" height="153.8" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#4ade80" stroke-width="1.5"/><text x="309.5" y="137.6" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Noise</text><text x="309.5" y="154.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">and cost</text><text x="309.5" y="175.2" font-size="10.5" fill="#4ade80" text-anchor="start">Gap the</text><text x="309.5" y="189.9" font-size="10.5" fill="#4ade80" text-anchor="start">battles</text><text x="309.5" y="204.6" font-size="10.5" fill="#4ade80" text-anchor="start">can</text><text x="309.5" y="219.3" font-size="10.5" fill="#4ade80" text-anchor="start">detect:</text><text x="309.5" y="234.0" font-size="10.5" fill="#4ade80" text-anchor="start">0.001.</text><text x="309.5" y="248.7" font-size="10.5" fill="#4ade80" text-anchor="start">Training:</text><text x="30" y="303.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Each stage was written down before any run.</text><text x="30" y="323.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> Per-field, corrected t is battled only if the</text><text x="30.0" y="339.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">check reaches 0.01 on the new per-field model.</text><rect x="408.0" y="63.6" width="376.0" height="326.8" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">2. Six checks, and the one that decides a row</text><text x="426.0" y="119.6" font-size="13" fill="#4ade80" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="119.6" font-size="11.5" fill="#f2f1ee" text-anchor="start">The linear masking rate hides the right share of</text><text x="446.0" y="135.7" font-size="11.5" fill="#f2f1ee" text-anchor="start">fields</text><text x="426.0" y="156.8" font-size="13" fill="#4ade80" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="156.8" font-size="11.5" fill="#f2f1ee" text-anchor="start">The corrected t is computed right</text><text x="426.0" y="177.9" font-size="13" fill="#fbbf24" text-anchor="start" font-weight="650">‖</text><text x="446.0" y="177.9" font-size="11.5" fill="#f2f1ee" text-anchor="start">The t check: under its bar, so the corrected t</text><text x="446.0" y="194.0" font-size="11.5" fill="#f2f1ee" text-anchor="start">barely matters</text><text x="426.0" y="215.1" font-size="13" fill="#4ade80" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="215.1" font-size="11.5" fill="#f2f1ee" text-anchor="start">The validation loss reproduces the logged value</text><text x="426.0" y="236.2" font-size="13" fill="#4ade80" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="236.2" font-size="11.5" fill="#f2f1ee" text-anchor="start">A fresh network learns under the linear masking rate</text><text x="426.0" y="257.3" font-size="13" fill="#4ade80" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="257.3" font-size="11.5" fill="#f2f1ee" text-anchor="start">Today&#x27;s code replays the old training&#x27;s first epoch</text><text x="422" y="302.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> Five checks passed with no battle. The</text><text x="422.0" y="318.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">sixth showed the model barely reads t.</text><text x="422" y="338.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> The t check read 0.005 on today&#x27;s default model</text><text x="422.0" y="354.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">and 0.008 on a model trained on the shuffled-only table.</text><text x="422.0" y="370.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">Its bar is 0.01.</text><rect x="16.0" y="406.4" width="376.0" height="314.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="30.0" y="432.4" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">3. The smallest detectable gap against</text><text x="30.0" y="450.4" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">training luck</text><path d="M30 574.4H378" fill="none" stroke="#a9a8a2" stroke-width="1" stroke-linejoin="round"/><rect x="93.0" y="527.4" width="48.0" height="47.0" rx="2" fill="#4ade80" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="117.0" y="522.4" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">0.001</text><text x="117.0" y="586.4" font-size="10" fill="#a9a8a2" text-anchor="middle">Smallest detectable gap</text><rect x="267.0" y="485.1" width="48.0" height="89.3" rx="2" fill="#fbbf24" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="291.0" y="480.1" font-size="11" fill="#f2f1ee" text-anchor="middle" font-weight="650">0.0019</text><text x="291.0" y="586.4" font-size="10" fill="#a9a8a2" text-anchor="middle">Training luck</text><text x="30" y="632.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> The battles detect a gap near 0.001, but</text><text x="30.0" y="648.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">training luck alone reached 0.0019.</text><text x="30" y="668.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> Two trainings of one recipe differed by up to</text><text x="30.0" y="684.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">0.0019 in error, so a linear win under 0.002 is treated</text><text x="30.0" y="700.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">as training luck.</text><rect x="408.0" y="406.4" width="376.0" height="314.0" rx="10" fill="#1f1f1e" fill-opacity="0.55" stroke="#3a3a35" stroke-width="1"/><text x="422.0" y="432.4" font-size="13" fill="#f2f1ee" text-anchor="start" font-weight="650">4. The plan before and after the two decisions</text><rect x="422.0" y="448.4" width="168.0" height="147.0" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#3a3a35" stroke-width="1"/><text x="430.0" y="468.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">Before</text><text x="430.0" y="488.2" font-size="10.5" fill="#a9a8a2" text-anchor="start">Control: today&#x27;s default</text><text x="430.0" y="502.9" font-size="10.5" fill="#a9a8a2" text-anchor="start">model</text><text x="430.0" y="520.6" font-size="10.5" fill="#a9a8a2" text-anchor="start">One training, 5.4 hours</text><text x="430.0" y="538.3" font-size="10.5" fill="#a9a8a2" text-anchor="start">Guidance 2 only</text><text x="430.0" y="556.0" font-size="10.5" fill="#a9a8a2" text-anchor="start">710,000 battles, 2.5 hours</text><rect x="602.0" y="448.4" width="168.0" height="147.0" rx="6" fill="#1f1f1e" fill-opacity="1.0" stroke="#5b9bf0" stroke-width="1.5"/><text x="610.0" y="468.4" font-size="12" fill="#f2f1ee" text-anchor="start" font-weight="650">After</text><text x="610.0" y="488.2" font-size="10.5" fill="#a9a8a2" text-anchor="start">Control: a new per-field</text><text x="610.0" y="502.9" font-size="10.5" fill="#a9a8a2" text-anchor="start">model</text><text x="610.0" y="520.6" font-size="10.5" fill="#a9a8a2" text-anchor="start">Two trainings, 13.4 hours</text><text x="610.0" y="538.3" font-size="10.5" fill="#a9a8a2" text-anchor="start">Guidance 2, 4 and 8</text><text x="610.0" y="556.0" font-size="10.5" fill="#a9a8a2" text-anchor="start">2.3 million battles, 8.1</text><text x="610.0" y="570.7" font-size="10.5" fill="#a9a8a2" text-anchor="start">hours</text><text x="422" y="619.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#f2f1ee">Reader takes:</tspan> The owner&#x27;s two decisions added one</text><text x="422.0" y="635.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">training and tripled the grids.</text><text x="422" y="655.4" font-size="11.5" fill="#a9a8a2"><tspan font-weight="650" fill="#5b9bf0">Measured:</tspan> Training goes from 5.4 to 13.4 hours, and</text><text x="422.0" y="671.4" font-size="11.5" fill="#a9a8a2" text-anchor="start">battles from 710,000 to 2.3 million.</text></svg>