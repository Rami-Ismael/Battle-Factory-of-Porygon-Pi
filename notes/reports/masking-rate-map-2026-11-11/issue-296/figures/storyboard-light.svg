<svg width="800" height="728" viewBox="0 0 800 728" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>The two trainings differ only in the masking rate. Before any battle, each model&#x27;s validation loss is read under both masking rates. A t check on the per-field model then decides whether Per-field, corrected t is battled: it is battled only at 0.01 or more.</title><text x="16.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="650">Two trainings that differ only in the masking rate, read before any battle</text><rect x="16.0" y="63.6" width="376.0" height="316.5" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">1. What changes between the two trainings</text><rect x="30.0" y="105.6" width="168.0" height="178.5" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="38.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Control: per-field</text><text x="38.0" y="142.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">model</text><text x="38.0" y="162.2" font-size="10.5" fill="#52514e" text-anchor="start">Masking rate: per-field</text><text x="38.0" y="179.9" font-size="10.5" fill="#52514e" text-anchor="start">Table: the shuffled-only</text><text x="38.0" y="194.6" font-size="10.5" fill="#52514e" text-anchor="start">table</text><text x="38.0" y="212.3" font-size="10.5" fill="#52514e" text-anchor="start">Same network and recipe</text><text x="38.0" y="230.0" font-size="10.5" fill="#52514e" text-anchor="start">Stops after 3 epochs with</text><text x="38.0" y="244.7" font-size="10.5" fill="#52514e" text-anchor="start">no new lowest loss, 80 at</text><text x="38.0" y="259.4" font-size="10.5" fill="#52514e" text-anchor="start">most</text><rect x="210.0" y="105.6" width="168.0" height="178.5" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="218.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Linear model</text><text x="218.0" y="145.4" font-size="10.5" fill="#52514e" text-anchor="start">Masking rate: linear</text><text x="218.0" y="163.1" font-size="10.5" fill="#52514e" text-anchor="start">Table: the shuffled-only</text><text x="218.0" y="177.8" font-size="10.5" fill="#52514e" text-anchor="start">table</text><text x="218.0" y="195.5" font-size="10.5" fill="#52514e" text-anchor="start">Same network and recipe</text><text x="218.0" y="213.2" font-size="10.5" fill="#52514e" text-anchor="start">Stops after 3 epochs with</text><text x="218.0" y="227.9" font-size="10.5" fill="#52514e" text-anchor="start">no new lowest loss, 80 at</text><text x="218.0" y="242.6" font-size="10.5" fill="#52514e" text-anchor="start">most</text><text x="30" y="308.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Only the masking rate differs, so a gap</text><text x="30.0" y="324.1" font-size="11.5" fill="#52514e" text-anchor="start">between the two models can be pinned on it.</text><text x="30" y="344.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> Both use the same 214,598 teams, one seed each,</text><text x="30.0" y="360.1" font-size="11.5" fill="#52514e" text-anchor="start">and at most 80 epochs.</text><rect x="408.0" y="63.6" width="376.0" height="316.5" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">2. Validation loss over training</text><path d="M448 111.6H462" fill="none" stroke="#52514e" stroke-width="2.2" stroke-linejoin="round"/><text x="466.0" y="115.1" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="650">Control: per-field model</text><path d="M624.4 111.6H638.4" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round"/><text x="642.4" y="115.1" font-size="10.5" fill="#2a78d6" text-anchor="start" font-weight="650">Linear model</text><path d="M448 127.6V227.6H764" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/><text x="606.0" y="244.6" font-size="10.5" fill="#52514e" text-anchor="middle">epochs, up to 80</text><text x="431" y="177.6" font-size="10.5" fill="#52514e" text-anchor="middle" transform="rotate(-90 431 177.6)">validation loss</text><path d="M448.0 132.6L511.2 182.6L606.0 197.6L764.0 201.6" fill="none" stroke="#52514e" stroke-width="2.2" stroke-linejoin="round"/><path d="M448.0 127.6L511.2 169.6L606.0 185.6L764.0 189.6" fill="none" stroke="#2a78d6" stroke-width="2.2" stroke-linejoin="round"/><text x="422" y="271.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Each line tracks one model&#x27;s validation</text><text x="422.0" y="287.6" font-size="11.5" fill="#52514e" text-anchor="start">loss as its training runs.</text><text x="422" y="307.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> Both curves fall and flatten, and neither turns</text><text x="422.0" y="323.6" font-size="11.5" fill="#52514e" text-anchor="start">upward.</text><text x="422" y="343.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> One curve turns upward, a sign of overfitting,</text><text x="422.0" y="359.6" font-size="11.5" fill="#52514e" text-anchor="start">and its run stops early.</text><rect x="16.0" y="396.1" width="376.0" height="316.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="422.1" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">3. Each model under each masking rate</text><text x="175.5" y="446.1" font-size="10.5" fill="#52514e" text-anchor="middle">Tested under per-field</text><text x="175.5" y="458.7" font-size="10.5" fill="#52514e" text-anchor="middle">rate</text><text x="310.5" y="446.1" font-size="10.5" fill="#52514e" text-anchor="middle">Tested under linear</text><text x="310.5" y="458.7" font-size="10.5" fill="#52514e" text-anchor="middle">rate</text><text x="30.0" y="494.1" font-size="10.5" fill="#52514e" text-anchor="start">Control:</text><text x="30.0" y="508.8" font-size="10.5" fill="#52514e" text-anchor="start">per-field</text><rect x="110.0" y="470.1" width="131.0" height="52.0" rx="6" fill="#16803c" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="175.5" y="500.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Lowest</text><rect x="245.0" y="470.1" width="131.0" height="52.0" rx="6" fill="#f3f2ee" fill-opacity="1" stroke="#d5d4cd" stroke-width="1"/><text x="310.5" y="500.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Higher</text><text x="30.0" y="550.1" font-size="10.5" fill="#52514e" text-anchor="start">Linear model</text><rect x="110.0" y="526.1" width="131.0" height="52.0" rx="6" fill="#f3f2ee" fill-opacity="1" stroke="#d5d4cd" stroke-width="1"/><text x="175.5" y="556.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Higher</text><rect x="245.0" y="526.1" width="131.0" height="52.0" rx="6" fill="#16803c" fill-opacity="0.2" stroke="#d5d4cd" stroke-width="1"/><text x="310.5" y="556.1" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">Lowest</text><text x="30" y="604.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Each model should score best under the</text><text x="30.0" y="620.1" font-size="11.5" fill="#52514e" text-anchor="start">masking rate it trained on.</text><text x="30" y="640.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> The linear model is lower under the linear rate</text><text x="30.0" y="656.1" font-size="11.5" fill="#52514e" text-anchor="start">and slightly higher under the per-field rate.</text><text x="30" y="676.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> The linear model is lower under both rates.</text><rect x="408.0" y="396.1" width="376.0" height="316.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="422.1" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">4. The t check on the new per-field model</text><path d="M422 546.1H770" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/><rect x="437.7" y="532.0" width="38.3" height="14.1" rx="2" fill="none" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="456.8" y="527.0" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">?</text><text x="456.8" y="558.1" font-size="10" fill="#52514e" text-anchor="middle">Species</text><rect x="507.3" y="527.3" width="38.3" height="18.8" rx="2" fill="none" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="526.4" y="522.3" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">?</text><text x="526.4" y="558.1" font-size="10" fill="#52514e" text-anchor="middle">Ability and</text><text x="526.4" y="570.1" font-size="10" fill="#52514e" text-anchor="middle">item</text><rect x="576.9" y="517.9" width="38.3" height="28.2" rx="2" fill="none" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="596.0" y="512.9" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">?</text><text x="596.0" y="558.1" font-size="10" fill="#52514e" text-anchor="middle">Moves</text><rect x="646.5" y="508.5" width="38.3" height="37.6" rx="2" fill="none" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="665.6" y="503.5" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">?</text><text x="665.6" y="558.1" font-size="10" fill="#52514e" text-anchor="middle">Stat</text><text x="665.6" y="570.1" font-size="10" fill="#52514e" text-anchor="middle">Alignment</text><rect x="716.1" y="513.2" width="38.3" height="32.9" rx="2" fill="none" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="735.2" y="508.2" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">?</text><text x="735.2" y="558.1" font-size="10" fill="#52514e" text-anchor="middle">Stat Points</text><path d="M422 468.08000000000004H770" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="716.4" y="453.1" width="53.6" height="13.0" rx="3" fill="#f3f2ee" fill-opacity="0.9" stroke="none" stroke-width="1"/><text x="766.0" y="463.1" font-size="10.5" fill="#52514e" text-anchor="end">bar 0.01</text><text x="422" y="604.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> The t check measures how far the model&#x27;s</text><text x="422.0" y="620.1" font-size="11.5" fill="#52514e" text-anchor="start">choices move when told the corrected t.</text><text x="422" y="640.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> Every field type stays under 0.01, as on</text><text x="422.0" y="656.1" font-size="11.5" fill="#52514e" text-anchor="start">today&#x27;s default model, and the row is not battled.</text><text x="422" y="676.1" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> One field type reaches 0.01, and Per-field,</text><text x="422.0" y="692.1" font-size="11.5" fill="#52514e" text-anchor="start">corrected t is battled.</text></svg>