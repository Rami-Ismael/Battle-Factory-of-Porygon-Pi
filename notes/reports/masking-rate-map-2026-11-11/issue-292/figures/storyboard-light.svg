<svg width="800" height="768" viewBox="0 0 800 768" xmlns="http://www.w3.org/2000/svg" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' role="img"><title>Seven of the 15 parts match MD4 or LLaDA: five match MD4, three match LLaDA, and one matches both. The other eight are ours alone. Two of those, the masking rate and the decoding order, are tested by the four new rows. A third, the t told while sampling, was tested and had no effect.</title><text x="16.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="650">Seven of 15 parts follow MD4 or LLaDA; the other eight are ours alone</text><rect x="16.0" y="63.6" width="376.0" height="334.2" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">1. Parts each paper matches</text><path d="M30 213.6H378" fill="none" stroke="#52514e" stroke-width="1" stroke-linejoin="round"/><rect x="64.0" y="182.6" width="48.0" height="31.0" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="88.0" y="177.6" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">5 of 15</text><text x="88.0" y="225.6" font-size="10" fill="#52514e" text-anchor="middle">MD4</text><rect x="180.0" y="194.8" width="48.0" height="18.8" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="204.0" y="189.8" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">3 of 15</text><text x="204.0" y="225.6" font-size="10" fill="#52514e" text-anchor="middle">LLaDA</text><rect x="296.0" y="169.4" width="48.0" height="44.2" rx="2" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="320.0" y="164.4" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="650">7 of 15</text><text x="320.0" y="225.6" font-size="10" fill="#52514e" text-anchor="middle">Either paper</text><text x="30" y="271.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Five of our 15 parts match MD4 and three</text><text x="30.0" y="287.6" font-size="11.5" fill="#52514e" text-anchor="start">match LLaDA. One, the loss weight, matches both, so seven</text><text x="30.0" y="303.6" font-size="11.5" fill="#52514e" text-anchor="start">match at least one.</text><text x="30" y="323.6" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> Counts from the matrix in the issue&#x27;s last</text><text x="30.0" y="339.6" font-size="11.5" fill="#52514e" text-anchor="start">comment, after the second check.</text><rect x="408.0" y="63.6" width="376.0" height="334.2" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="89.6" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">2. Follows a paper, or ours alone</text><rect x="422.0" y="105.6" width="168.0" height="196.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="430.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Follows a paper: 7</text><text x="430.0" y="142.4" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">parts</text><text x="430.0" y="162.2" font-size="10.5" fill="#52514e" text-anchor="start">Both papers: loss weight</text><text x="430.0" y="179.9" font-size="10.5" fill="#52514e" text-anchor="start">LLaDA: dividing the loss by</text><text x="430.0" y="194.6" font-size="10.5" fill="#52514e" text-anchor="start">84</text><text x="430.0" y="212.3" font-size="10.5" fill="#52514e" text-anchor="start">MD4: how t is drawn, and</text><text x="430.0" y="227.0" font-size="10.5" fill="#52514e" text-anchor="start">time input</text><text x="430.0" y="244.7" font-size="10.5" fill="#52514e" text-anchor="start">LLaDA: guidance mixing</text><text x="430.0" y="262.4" font-size="10.5" fill="#52514e" text-anchor="start">MD4: drawing a sample, and</text><text x="430.0" y="277.1" font-size="10.5" fill="#52514e" text-anchor="start">Stat Points as tokens</text><rect x="602.0" y="105.6" width="168.0" height="196.2" rx="6" fill="#f3f2ee" fill-opacity="1.0" stroke="#d5d4cd" stroke-width="1"/><text x="610.0" y="125.6" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="650">Ours alone: 8 parts</text><text x="610.0" y="145.4" font-size="10.5" fill="#52514e" text-anchor="start">Per-field masking rate</text><text x="610.0" y="163.1" font-size="10.5" fill="#52514e" text-anchor="start">Decoding order, and the t</text><text x="610.0" y="177.8" font-size="10.5" fill="#52514e" text-anchor="start">told while sampling</text><text x="610.0" y="195.5" font-size="10.5" fill="#52514e" text-anchor="start">Ask dropout in training</text><text x="610.0" y="213.2" font-size="10.5" fill="#52514e" text-anchor="start">Validation draws</text><text x="610.0" y="230.9" font-size="10.5" fill="#52514e" text-anchor="start">Slot shuffling, and the two</text><text x="610.0" y="245.6" font-size="10.5" fill="#52514e" text-anchor="start">legal filters</text><text x="422" y="325.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Seven parts do what a paper does; the other</text><text x="422.0" y="341.8" font-size="11.5" fill="#52514e" text-anchor="start">eight are ours alone.</text><text x="422" y="361.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> The division by 84 matches LLaDA&#x27;s Algorithm 1,</text><text x="422.0" y="377.8" font-size="11.5" fill="#52514e" text-anchor="start">not MD4&#x27;s.</text><rect x="16.0" y="413.8" width="376.0" height="338.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="30.0" y="439.8" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">3. What the second check changed</text><text x="34.0" y="469.8" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="469.8" font-size="11.5" fill="#0b0b0b" text-anchor="start">Stat Points as tokens, MD4: now the same. Pixel</text><text x="54.0" y="485.9" font-size="11.5" fill="#0b0b0b" text-anchor="start">values are 256 tokens</text><text x="34.0" y="507.0" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="507.0" font-size="11.5" fill="#0b0b0b" text-anchor="start">Validation draws, MD4: now differs. 32 draws on one</text><text x="54.0" y="523.1" font-size="11.5" fill="#0b0b0b" text-anchor="start">benchmark</text><text x="34.0" y="544.2" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="544.2" font-size="11.5" fill="#0b0b0b" text-anchor="start">Validation draws, LLaDA: 128 draws, or 1 for</text><text x="54.0" y="560.3" font-size="11.5" fill="#0b0b0b" text-anchor="start">one-token answers</text><text x="34.0" y="581.4" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="581.4" font-size="11.5" fill="#0b0b0b" text-anchor="start">Guidance mixing, LLaDA: same form, used only in an</text><text x="54.0" y="597.5" font-size="11.5" fill="#0b0b0b" text-anchor="start">appendix test</text><text x="34.0" y="618.6" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="54.0" y="618.6" font-size="11.5" fill="#0b0b0b" text-anchor="start">Legal filter while sampling, ours: every value</text><text x="54.0" y="634.7" font-size="11.5" fill="#0b0b0b" text-anchor="start">reopens if none is legal</text><text x="30" y="679.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> A second check changed five of 45 cells,</text><text x="30.0" y="695.8" font-size="11.5" fill="#52514e" text-anchor="start">and the matching count rose from 6 to 7 of 15.</text><text x="30" y="715.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#2a78d6">Measured:</tspan> Each correction was confirmed at its quoted</text><text x="30.0" y="731.8" font-size="11.5" fill="#52514e" text-anchor="start">line in the paper&#x27;s LaTeX source.</text><rect x="408.0" y="413.8" width="376.0" height="338.0" rx="10" fill="#f3f2ee" fill-opacity="0.55" stroke="#d5d4cd" stroke-width="1"/><text x="422.0" y="439.8" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="650">4. The three departures this map tests</text><text x="426.0" y="469.8" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="650">→</text><text x="446.0" y="469.8" font-size="11.5" fill="#0b0b0b" text-anchor="start">Masking rate: per-field against linear, tested by</text><text x="446.0" y="485.9" font-size="11.5" fill="#0b0b0b" text-anchor="start">the four new rows</text><text x="426.0" y="507.0" font-size="13" fill="#2a78d6" text-anchor="start" font-weight="650">→</text><text x="446.0" y="507.0" font-size="11.5" fill="#0b0b0b" text-anchor="start">Decoding order: species first against random, tested</text><text x="446.0" y="523.1" font-size="11.5" fill="#0b0b0b" text-anchor="start">by the four new rows</text><text x="426.0" y="544.2" font-size="13" fill="#16803c" text-anchor="start" font-weight="650">✓</text><text x="446.0" y="544.2" font-size="11.5" fill="#0b0b0b" text-anchor="start">t told while sampling: tested, no effect</text><text x="422" y="621.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#0b0b0b">Reader takes:</tspan> Masking rate and decoding order are not run</text><text x="422.0" y="637.8" font-size="11.5" fill="#52514e" text-anchor="start">yet; the four rows written before any result test them.</text><text x="422" y="657.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#16803c">Expected:</tspan> Linear, random order loses to Linear,</text><text x="422.0" y="673.8" font-size="11.5" fill="#52514e" text-anchor="start">species-first, with an error under 2.8 times as large.</text><text x="422" y="693.8" font-size="11.5" fill="#52514e"><tspan font-weight="650" fill="#a16207">Surprise:</tspan> A linear row that wins by 0.002 or more.</text></svg>