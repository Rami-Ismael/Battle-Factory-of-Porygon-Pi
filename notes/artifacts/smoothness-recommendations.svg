<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs><style>text{font-family:'Comic Sans MS','Chalkboard',sans-serif;fill:#243247;font-size:17px}.title{font-size:30px;font-weight:bold}.heading{font-size:23px;font-weight:bold}.small{font-size:14px}.muted{fill:#566477}.ink{fill:none;stroke:#243247;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke:#a9b3c2;stroke-width:1.5;stroke-linecap:round}.violet{fill:none;stroke:#7c46aa;stroke-width:2.5;stroke-linecap:round}.blue{fill:none;stroke:#2863a8;stroke-width:2.5;stroke-linecap:round}.base{fill:#243247}.edit{fill:#7c46aa}.panel{fill:#fff;stroke:#a9b3c2;stroke-width:1.5}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#2863a8" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1200" fill="#f7f9fc"/>
