StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = Google
Vocab = Porygon

[*.md]
BasedOnStyles = Vale, Google, Porygon
# Obsidian wikilinks and embeds are note titles, not prose
TokenIgnores = (!?\[\[[^\]]+\]\])
# These two clash with the blog prompt: posts are first person and mark links "(private)"
Google.FirstPerson = NO
Google.Parens = NO
