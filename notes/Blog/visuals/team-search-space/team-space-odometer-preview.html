  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)

  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);

}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {

  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;

  left: 0;

  height: 16px;

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {

  height: 28px;

}

.form-range:focus-visible::-moz-range-thumb {

.btn:not(.btn-primary, .viz-tile):is(

const stageTitles=[&#x27;Six species, one roster&#x27;,&#x27;Forms are alternatives&#x27;,&#x27;Watch the wheels carry&#x27;,&#x27;Items share one pool&#x27;,&#x27;Count sets, not move order&#x27;,&#x27;Six alignment wheels&#x27;,&#x27;Stat wheels share a budget&#x27;,&#x27;The full configuration count&#x27;];
const notes=[
 &#x27;A roster appears once in a canonical species order. Advancing a species wheel cannot introduce a duplicate.&#x27;,
 &#x27;For a chosen roster, multiply its form counts. Then add across all six-species rosters.&#x27;,
 &#x27;A small Garchomp example: 2 abilities × 3 items × 3 sample movesets = 18 configurations. The right wheel turns fastest, then carries left.&#x27;,
 &#x27;These six members share the item pool. The wheels advance together through assignments with no repeated held item.&#x27;,
 &#x27;Each display is one four-move set for Garchomp. Sorted move labels keep reordered copies from being counted twice.&#x27;,
 &#x27;Each member gets its own alignment. These wheels show a few choices from the 21-option model.&#x27;,
 &#x27;These six wheels are coupled: they always sum to 66, with no value above 32. Independent 0–32 wheels would overcount.&#x27;,
