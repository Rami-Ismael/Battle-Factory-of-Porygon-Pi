const T = 18, W = 1080, H = 1350;

const N = {
	plainHigh: D.plain.legal[3], tunedHigh: D.tuned.legal[3], jevLegal: D.jev.legal, tasks: D.tasks,
	plainWin: D.plain.usable[3], tunedWin: D.tuned.usable[3], jevWin: D.jev.usable,

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOut = u => 1 - Math.pow(1 - u, 3);
const lerp = (a, b, u) => a + (b - a) * u;
const on = (t, a, b, f = .3) => seg(t, a, a + f) * (1 - seg(t, b - f, b));

function txt(s, x, y, font, color, { align = "left", alpha = 1, base = "alphabetic" } = {}) {
	if (alpha <= 0) return;
	ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
	ctx.fillText(s, x, y); ctx.restore();
}
function lines(s, maxW, font) {
	ctx.save(); ctx.font = font;
	const out = []; let line = "";
	for (const w of s.split(" ")) {
		const test = line ? line + " " + w : w;
		if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
	}
	if (line) out.push(line);
	ctx.restore(); return out;
}
function para(s, x, y, maxW, lh, font, color, opts = {}) {
	const ls = lines(s, maxW, font);
	ls.forEach((l, i) => txt(l, x, y + i * lh, font, color, opts));
	return y + ls.length * lh;
}
function box(x, y, w, h, r, fill, stroke, lw = 2) {
	ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
	if (fill) { ctx.fillStyle = fill; ctx.fill(); }
	if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}

const imgs = {};
function loadImages() {
	return Promise.all(D.example.team.flatMap((p, i) => [["s" + i, p.sprite], ["i" + i, p.itemIcon]].map(([k, src]) => new Promise(res => {
		const im = new Image(); im.onload = im.onerror = res; im.src = src; imgs[k] = im;
	}))));
}
function pic(key, x, y, size, alpha = 1) {
	const im = imgs[key]; if (!im || !im.width || alpha <= 0) return;
	const s = size / Math.max(im.width, im.height);
	ctx.save(); ctx.globalAlpha *= alpha; ctx.imageSmoothingEnabled = false;
	ctx.drawImage(im, x + (size - im.width * s) / 2, y + (size - im.height * s) / 2, im.width * s, im.height * s);
	ctx.restore();
}
// Six sprites with their items, as the house rule asks.
function teamStrip(x, y, w, size, alpha) {
	const cell = w / 6;
	D.example.team.forEach((p, i) => {
		const cx = x + i * cell + (cell - size) / 2;
		pic("s" + i, cx, y, size, alpha);
		pic("i" + i, cx + size * .62, y + size * .62, size * .42, alpha);
	});
}

		cols.forEach((c, k) => txt(c, cx[k], 380, F(700, 32), C.dim, { align: "center", alpha: a }));
		rows.forEach(([name, vals, color, start], r) => {

			txt("PROMPT", 72, y + 144, F(600, 32), C.dim, { alpha: a });

				if (guess) t0 = 8.0;
				const u = easeOut(seg(t, t0, t0 + .45));
				if (guess && t >= 6.95 && t < 8.0) {
					txt("?", cx[k], y + 112, F(800, 80), C.tuned, { align: "center", alpha: a * (.55 + .45 * Math.sin(t * 9)) });
					txt("GUESS", cx[k], y + 160, F(700, 32), C.dim, { align: "center", alpha: a });

				}
				if (shown && u > 0) {
					txt(String(Math.round(v * u)), cx[k], y + 112, F(800, 72), C.ink, { align: "center", alpha: a });
					box(x + 16, y + 140, 140, 14, 7, C.line);
					box(x + 16, y + 140, 140 * (v / N.tasks) * u, 14, 7, color);
				}
			});
		});
		const d = a * seg(t, 8.6, 9.0);
		if (d > 0) { ctx.save(); ctx.globalAlpha = d; box(830, 836, 188, 64, 32, C.tuned); ctx.restore(); }
		txt(`+${N.tunedHigh - N.plainHigh}`, 924, 882, F(800, 44), C.bg, { align: "center", alpha: d });
		para(`At high reasoning: ${N.plainHigh} → ${N.tunedHigh} legal teams. Jev built all ${N.jevLegal}.`, 72, 980, 936, 46, F(600, 38), C.ink, { alpha: a * seg(t, 8.6, 9) });
	}

	// Scene 2: the win-rate gap closing.
	a = on(t, 9.7, 15.7);
	if (a > 0) {

		const g = seg(t, 10.5, 11.0);

		const m = easeOut(seg(t, 11.3, 13.3)), tx = px(lerp(N.plainWin, N.tunedWin, m));
		if (m > 0) box(px(N.plainWin), y - 10, tx - px(N.plainWin), 20, 10, C.tuned);

			if (alpha <= 0) return;

			txt(label, x, above ? y - 96 : y + 130, F(800, 36), color, { align: "center", alpha: a * alpha });

		};
		mark(px(N.plainWin), C.plain, "PLAIN", pct(N.plainWin), true, seg(t, 9.9, 10.3));
		mark(px(N.jevWin), C.jev, "JEV", pct(N.jevWin), true, seg(t, 10.1, 10.5));
		mark(tx, C.tuned, "TUNED", pct(lerp(N.plainWin, N.tunedWin, m)), false, seg(t, 11.3, 11.6));

	}

	// Scene 3: the claim.
	a = on(t, 15.7, T + 1);
	if (a > 0) {
		txt("TUNING CLOSED", 540, 430, F(800, 84), C.ink, { align: "center", alpha: a });
		txt(`${N.gapText.toUpperCase()} OF THE GAP`, 540, 525, F(800, 84), C.tuned, { align: "center", alpha: a });
		txt(`${N.plainHigh} → ${N.tunedHigh} legal teams of ${N.tasks}. Jev: all ${N.jevLegal}.`, 540, 640, F(600, 40), C.ink, { align: "center", alpha: a });
		teamStrip(180, 720, 720, 104, a);
	}
	if (t > 9.7) para(CAPTION, 72, 1180, 936, 40, F(500, 32), C.dim, { alpha: seg(t, 9.7, 10.1) });
}

// ---------- B: one team, fixed, then all 270 ----------
function drawB(t) {
	const C = { bg: "#f4efe4", card: "#fffdf8", edge: "#d8ccb6", ink: "#1f1b16", dim: "#6d6457", plain: "#8a7f71", tuned: "#2e7d57", bad: "#c0392b", jev: "#27466e", hide: "#eee6d6" };

	if (a > 0) {
		txt("One of the " + N.tasks + " tasks", 72, 128, F(700, 52), C.ink, { alpha: a });

			const x = 72 + (i % 3) * 320, y = 230 + Math.floor(i / 3) * 470, ap = a * seg(t, .2 + i * .15, .55 + i * .15);

					txt("?", x + 148, yy + 28, F(700, 32), C.dim, { align: "center", alpha: ap * focus });

			});
		});

	// Scenes 1 and 2: Kleavor's one hidden move, plain then tuned.
	a = on(t, 3.3, 11.2);
	if (a > 0) {
		const zoom = lerp(.92, 1, easeOut(seg(t, 3.3, 3.8)));
		ctx.save(); ctx.translate(540, 570); ctx.scale(zoom, zoom); ctx.translate(-540, -570);
		const tuned = t >= 7.2;
		txt(tuned ? "Tuned prompt, high reasoning" : "Plain prompt, high reasoning", 540, 190, F(700, 44), tuned ? C.tuned : C.ink, { align: "center", alpha: a });
		if (tuned) txt("DSPy answer types + a GEPA prompt written by GPT-6 Luna", 540, 236, F(500, 32), C.dim, { align: "center", alpha: a * seg(t, 7.2, 7.6) });
		box(140, 270, 800, 640, 26, C.card, C.edge, 3);
		pic("s0", 180, 300, 240, a); pic("i0", 360, 440, 84, a);
		txt(kleavor.species, 470, 380, F(700, 56), C.ink, { alpha: a });
		txt("@ " + kleavor.item, 470, 430, F(500, 36), C.dim, { alpha: a });
		kleavor.moves.forEach((mv, j) => {
			const y = 600 + j * 72;
			if (mv !== null) { txt("·  " + mv, 200, y, F(600, 44), C.ink, { alpha: a }); return; }
			ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([10, 8]); box(190, y - 46, 560, 62, 10, C.hide, C.dim, 2); ctx.restore();
			if (!tuned) {
				const n = Math.round(plainMove.length * seg(t, 4.3, 5.1));
				txt("·  " + plainMove.slice(0, n), 200, y, F(600, 44), C.bad, { alpha: a });
			} else {
				const s = seg(t, 7.4, 7.8);
				if (s < 1) txt("·  " + plainMove, 200, y, F(600, 44), C.bad, { alpha: a * (1 - s) });
				const n = Math.round(tunedMove.length * seg(t, 7.9, 8.6));
				txt("·  " + tunedMove.slice(0, n), 200, y, F(600, 44), C.tuned, { alpha: a });
			}
		});
		if (!tuned) {
			const s = easeOut(seg(t, 5.4, 5.8));
			if (s > 0) {
				ctx.save(); ctx.globalAlpha = a * s; ctx.translate(800, 500); ctx.rotate(-.18); ctx.scale(lerp(1.4, 1, s), lerp(1.4, 1, s));
				box(-130, -46, 260, 92, 12, null, C.bad, 7); txt("ILLEGAL", 0, 18, F(800, 52), C.bad, { align: "center" }); ctx.restore();
				txt(D.example.plainError, 540, 970, F(600, 40), C.bad, { align: "center", alpha: a * s });

				ctx.save(); ctx.globalAlpha = a * s; ctx.translate(800, 500); box(-120, -46, 240, 92, 46, C.tuned, null);

	// Scene 3: zoom out to every task.

	if (a > 0) {
		txt("All " + N.tasks + " tasks", 72, 128, F(700, 52), C.ink, { alpha: a });
		txt("Each square is one half-built team. Filled means legal.", 72, 184, F(500, 34), C.dim, { alpha: a });

		const yT = y0 + Math.ceil(n / cols) * cell + 70;
		if (t < 13.0) txt(`Plain prompt: ${filled} legal`, 72, yT, F(700, 40), C.dim, { alpha: a * seg(t, 11.5, 11.8) });
		else if (t < 13.9) txt("Guess: how many with the tuned prompt?", 72, yT, F(700, 40), C.ink, { alpha: a });
		else txt(`Tuned prompt: ${filled} legal`, 72, yT, F(700, 40), C.tuned, { alpha: a });
		txt(`Jev: all ${N.jevLegal}`, 1008, yT, F(700, 40), C.jev, { align: "right", alpha: a * seg(t, 13.9, 14.3) });
		const e = seg(t, 15.6, 16.1);
		txt(`Win rate with illegal teams as losses: ${pct(N.plainWin)} → ${pct(N.tunedWin)}`, 72, yT + 62, F(600, 36), C.ink, { alpha: a * e });
		txt(`Jev ${pct(N.jevWin)}. ${N.gapText[0].toUpperCase() + N.gapText.slice(1)} of the gap, closed.`, 72, yT + 112, F(700, 40), C.tuned, { alpha: a * e });
		para(CAPTION, 72, 1220, 936, 38, F(500, 32), C.dim, { alpha: a * e });
	}
}

		txt(`Jev ${N.jevLegal}`, 800, y(N.jevLegal) - 12, FL(700, 32), C.jev, { alpha: a * seg(t, 2.5, 2.8) });
		const series = (vals, color, t0, dt, upTo) => {
			ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.lineJoin = "round"; ctx.beginPath();
			let drawn = false;
			for (let k = 0; k < upTo; k++) {
				const u = seg(t, t0 + k * dt, t0 + (k + 1) * dt);

				if (k === 0) ctx.moveTo(x(0), y(vals[0]));

				drawn = true;
			}
			if (drawn) ctx.stroke(); ctx.restore();
			for (let k = 0; k < upTo; k++) {
				const u = seg(t, t0 + k * dt + dt * .7, t0 + (k + 1) * dt);
				if (u <= 0) continue;
				ctx.save(); ctx.globalAlpha = u; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x(k), y(vals[k]), 12, 0, 7); ctx.fill(); ctx.restore();

	// Chart 2: the win-rate gap at high reasoning.

	if (a > 0) {
		const px = v => 200 + (v - .30) / .20 * 760, yA = 1010;
		txt("Win rate at high reasoning, illegal teams as losses", 72, 925, FL(700, 32), C.ink, { alpha: a });

		txt("30%", px(.30) - 16, yA + 11, FL(400, 32), C.dim, { align: "right", alpha: a });
		txt("50%", px(.50) + 16, yA + 11, FL(400, 32), C.dim, { alpha: a });
		const m = ease(seg(t, 10.8, 12.6)), tx = px(lerp(N.plainWin, N.tunedWin, m));
		if (m > 0) {
			ctx.save(); ctx.globalAlpha = a * .28; ctx.fillStyle = C.tuned; ctx.fillRect(px(N.plainWin), yA - 18, tx - px(N.plainWin), 36); ctx.restore();
			ctx.save(); ctx.strokeStyle = C.tuned; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(px(N.plainWin), yA); ctx.lineTo(tx, yA); ctx.stroke(); ctx.restore();
		}
		const dot = (xx, color, alpha, diamond) => {
			if (alpha <= 0) return;
			ctx.save(); ctx.globalAlpha = a * alpha; ctx.fillStyle = color; ctx.beginPath();
			if (diamond) { ctx.moveTo(xx, yA - 18); ctx.lineTo(xx + 18, yA); ctx.lineTo(xx, yA + 18); ctx.lineTo(xx - 18, yA); ctx.closePath(); } else ctx.arc(xx, yA, 14, 0, 7);
			ctx.fill(); ctx.restore();

		dot(px(N.plainWin), C.plain, seg(t, 9.9, 10.2));

		txt(`Jev ${pct(N.jevWin)}`, px(N.jevWin), yA - 34, FL(600, 32), C.jev, { align: "center", alpha: a * seg(t, 10.2, 10.5) });
		dot(tx, C.tuned, seg(t, 10.8, 11.0));
		txt(`tuned ${pct(lerp(N.plainWin, N.tunedWin, m))}`, tx, yA + 56, FL(600, 32), C.tuned, { align: "center", alpha: a * seg(t, 10.8, 11.0) });
		txt(`${N.gapText[0].toUpperCase() + N.gapText.slice(1)} of the gap, closed`, 72, yA + 112, FL(700, 36), C.tuned, { alpha: a * seg(t, 12.8, 13.3) });
		txt(`Same ${N.sharedMasks} tasks, both legal: Jev ${pct(N.sharedJev)}, Mercury ${pct(N.sharedMercury)}.`, 72, yA + 156, FL(400, 32), C.dim, { alpha: a * seg(t, 13.6, 14.1) });
	}
	if (t > 15.2) para(CAPTION, 72, 1215, 936, 36, FL(400, 32), C.dim, { alpha: seg(t, 15.2, 15.7) });
}

// ---------- player and switcher ----------
const VARIANTS = [{ key: "A", name: "Scoreboard", draw: drawA }, { key: "B", name: "One team, fixed", draw: drawB }, { key: "C", name: "Annotated chart", draw: drawC }];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(v => v.key === (params.get("variant") || "A").toUpperCase()));
let t = params.has("t") ? clamp(+params.get("t"), 0, T) : (reduce ? T : 0);
let playing = !params.has("t") && !reduce, last = null;
const $ = id => document.getElementById(id);
if (params.has("capture")) document.body.classList.add("capture");

function render() {
	VARIANTS[vi].draw(t);
	$("scrub").value = t; $("clock").value = t.toFixed(1) + " s";
	$("play").textContent = playing ? "Pause" : (t >= T ? "Replay" : "Play");
	$("label").textContent = VARIANTS[vi].key + " · " + VARIANTS[vi].name;
}
function tick(now) {
	if (playing) {
		if (last !== null) t += (now - last) / 1000;
		last = now;
		if (t >= T) { t = T; playing = false; last = null; }
	} else last = null;
	render(); requestAnimationFrame(tick);
}
function setVariant(i) {
	vi = (i + VARIANTS.length) % VARIANTS.length;
	const u = new URL(location.href); u.searchParams.set("variant", VARIANTS[vi].key); u.searchParams.delete("t");
	history.replaceState(null, "", u);
	t = reduce ? T : 0; playing = !reduce; last = null;
}
$("play").addEventListener("click", () => { if (t >= T) t = 0; playing = !playing; last = null; });
$("restart").addEventListener("click", () => { t = 0; playing = true; last = null; });
$("scrub").addEventListener("input", e => { t = +e.target.value; playing = false; });
$("prev").addEventListener("click", () => setVariant(vi - 1));
$("next").addEventListener("click", () => setVariant(vi + 1));
addEventListener("keydown", e => {
	const el = document.activeElement;
	if (el && (el.matches("input, textarea, select") || el.isContentEditable)) return;
	if (e.key === "ArrowLeft") setVariant(vi - 1);
	if (e.key === "ArrowRight") setVariant(vi + 1);
});
loadImages().then(() => requestAnimationFrame(tick));
</script>
