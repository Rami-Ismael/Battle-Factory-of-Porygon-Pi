<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1170" viewBox="0 0 1170 1170"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#24344b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="59.0" font-size="34" fill="#24344b">DiBO: train a generator to propose improvements</text><text x="45" y="97.0" font-size="19" fill="#24344b">Training Diffusion Language Models for Black-Box Optimization | March 2026</text><text x="45" y="152.0" font-size="22" fill="#24344b">1   START WITH SCORED EXAMPLES</text><rect x="45" y="172" width="1080" height="124" rx="12" fill="#eef2ff" stroke="#24344b" stroke-width="2"/><text x="65" y="211.0" font-size="23" fill="#24344b">Fixed offline data → prompts containing designs + scores → target responses</text><text x="65" y="250.0" font-size="20" fill="#24344b">Special delimiters mark designs and labels. Training examples use similar designs.</text><text x="65" y="276.0" font-size="20" fill="#24344b">For domain adaptation and SFT, the target scores higher than every prompt example.</text><text x="45" y="347.0" font-size="22" fill="#24344b">2   UPDATE THE SAME MODEL THROUGH THREE STAGES</text><rect x="45" y="370" width="320" height="208" rx="12" fill="#dbeafe" stroke="#24344b" stroke-width="2"/><text x="61" y="411.0" font-size="23" fill="#24344b">A. Domain adaptation</text><text x="61" y="448.0" font-size="18" fill="#24344b">Mask prompt AND response.</text><text x="61" y="471.4" font-size="18" fill="#24344b">Learn to reconstruct both.</text><text x="61" y="494.8" font-size="18" fill="#24344b"></text><text x="61" y="518.2" font-size="18" fill="#24344b">Learn the domain’s format.</text><rect x="425" y="370" width="320" height="208" rx="12" fill="#dcfce7" stroke="#24344b" stroke-width="2"/><text x="441" y="411.0" font-size="23" fill="#24344b">B. Supervised fine-tuning</text><text x="441" y="448.0" font-size="18" fill="#24344b">Keep the prompt visible.</text><text x="441" y="471.4" font-size="18" fill="#24344b">Reconstruct a better response.</text><text x="441" y="494.8" font-size="18" fill="#24344b"></text><text x="441" y="518.2" font-size="18" fill="#24344b">Learn examples of improvement.</text><rect x="805" y="370" width="320" height="208" rx="12" fill="#ffedd5" stroke="#24344b" stroke-width="2"/><text x="821" y="411.0" font-size="23" fill="#24344b">C. Reward-based training</text><text x="821" y="448.0" font-size="18" fill="#24344b">Use better AND worse responses.</text><text x="821" y="471.4" font-size="18" fill="#24344b">Reward = response score</text><text x="821" y="494.8" font-size="18" fill="#24344b">               − best prompt score.</text><text x="821" y="518.2" font-size="18" fill="#24344b">Learn signed improvements.</text><path d="M369 470h48" stroke="#24344b" stroke-width="2" marker-end="url(#a)"/><path d="M749 470h48" stroke="#24344b" stroke-width="2" marker-end="url(#a)"/><text x="45" y="632.0" font-size="22" fill="#24344b">3   POKÉMON ANALOGY — invented scores, not an experiment in the paper</text><rect x="45" y="653" width="1080" height="163" rx="12" fill="#f8fafc" stroke="#24344b" stroke-width="2"/><text x="65" y="692.0" font-size="22" fill="#24344b">Prompt: Team A = 50% win rate; Team B = 60%. Best prompt score = 0.60.</text><text x="65" y="736.0" font-size="22" fill="#24344b">SFT target: Team C = 70% → practice reconstructing C.</text><text x="65" y="764.6" font-size="22" fill="#24344b">Reward training: C gives +0.10; Team D at 55% gives −0.05.</text><text x="65" y="797.0" font-size="17" fill="#24344b">Assume the same opponents and evaluation conditions for every score.</text><text x="45" y="872.0" font-size="22" fill="#24344b">4   GENERATE AFTER TRAINING</text><rect x="45" y="892" width="1080" height="117" rx="12" fill="#f3e8ff" stroke="#24344b" stroke-width="2"/><text x="65" y="933.0" font-size="23" fill="#24344b">Prompt + masked response → iterative unmasking → new candidate designs</text><text x="65" y="974.0" font-size="20" fill="#24344b">The earlier dLLM paper steers with tree search; DiBO’s central change is training.</text><text x="45" y="1061.0" font-size="21" fill="#24344b">For your project: stored battle results could become training examples. New teams</text><text x="45" y="1088.3" font-size="21" fill="#24344b">still need legality checks and fresh battles; learning a pattern cannot guarantee a win.</text><text x="45" y="1131.0" font-size="17" fill="#566479">Source: arxiv.org/html/2603.17919v1 — §3, §4 and Appendix A.2</text></g></svg>