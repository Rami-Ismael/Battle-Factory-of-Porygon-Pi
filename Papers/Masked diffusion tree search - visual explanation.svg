<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#24344b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="63.0" font-size="38" fill="#24344b">How masked diffusion tree search works</text><text x="45" y="104.0" font-size="21" fill="#24344b">Earlier dLLM paper (January 2026) | Read the blue path down, then follow the orange feedback.</text><rect x="45" y="130" width="1410" height="100" rx="12" fill="#eef2ff" stroke="#24344b" stroke-width="2"/><text x="63" y="166.0" font-size="22" fill="#24344b">Before searching</text><text x="63" y="198.0" font-size="19" fill="#24344b">Fit a Gaussian process (GP) to scored designs. Prompt the diffusion LLM with the task and examples.</text><text x="45" y="289.0" font-size="23" fill="#24344b">THE SEARCH TREE</text><text x="45" y="321.0" font-size="18" fill="#566479">Illustration: 4 token positions; fewer branches shown for readability.</text><rect x="430" y="345" width="320" height="98" rx="12" fill="#dbeafe" stroke="#24344b" stroke-width="2"/><text x="448" y="381.0" font-size="22" fill="#24344b">Root: fully masked</text><text x="448" y="413.0" font-size="19" fill="#24344b">[ ?   ?   ?   ? ]</text><path d="M470 443L230 500" fill="none" stroke="#24344b" stroke-width="2" marker-end="url(#a)"/><path d="M590 443L590 500" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><path d="M710 443L950 500" fill="none" stroke="#24344b" stroke-width="2" marker-end="url(#a)"/><rect x="70" y="500" width="320" height="100" rx="12" fill="#f1f5f9" stroke="#24344b" stroke-width="2"/><text x="88" y="536.0" font-size="22" fill="#24344b">Alternative branch</text><text x="88" y="568.0" font-size="19" fill="#24344b">[ A   ?   ?   ? ]</text><rect x="430" y="500" width="320" height="100" rx="12" fill="#dbeafe" stroke="#24344b" stroke-width="2"/><text x="448" y="536.0" font-size="22" fill="#24344b">1. Select this branch</text><text x="448" y="568.0" font-size="19" fill="#24344b">[ ?   C   ?   ? ]</text><rect x="790" y="500" width="320" height="100" rx="12" fill="#f1f5f9" stroke="#24344b" stroke-width="2"/><text x="808" y="536.0" font-size="22" fill="#24344b">Alternative branch</text><text x="808" y="568.0" font-size="19" fill="#24344b">[ ?   ?   G   ? ]</text><text x="1145" y="515.0" font-size="20" fill="#24344b">Selection balances:</text><text x="1145" y="551.0" font-size="19" fill="#24344b">• average reward</text><text x="1145" y="575.7" font-size="19" fill="#24344b">• fewer visits</text><text x="1145" y="600.4" font-size="19" fill="#24344b">• model likelihood</text><path d="M525 668L355 695" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><path d="M655 668L715 695" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><text x="70" y="661.0" font-size="21" fill="#24344b">2. Expand: sample completions, then remask low-confidence tokens.</text><rect x="195" y="695" width="320" height="104" rx="12" fill="#dcfce7" stroke="#24344b" stroke-width="2"/><text x="213" y="731.0" font-size="22" fill="#24344b">New child A</text><text x="213" y="763.0" font-size="19" fill="#24344b">[ A   C   ?   ? ]</text><rect x="555" y="695" width="320" height="104" rx="12" fill="#dcfce7" stroke="#24344b" stroke-width="2"/><text x="573" y="731.0" font-size="22" fill="#24344b">New child B</text><text x="573" y="763.0" font-size="19" fill="#24344b">[ ?   C   G   ? ]</text><path d="M880 747L960 747" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="970" y="668" width="485" height="166" rx="12" fill="#f3e8ff" stroke="#24344b" stroke-width="2"/><text x="988" y="704.0" font-size="22" fill="#24344b">3. Finish each child several ways</text><text x="988" y="736.0" font-size="19" fill="#24344b">Child B → [ A C G T ]</text><text x="988" y="760.7" font-size="19" fill="#24344b">            → [ T C G A ]</text><text x="988" y="785.4" font-size="19" fill="#24344b">            → ... five complete designs</text><path d="M1212 834L1212 880" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><rect x="970" y="880" width="485" height="163" rx="12" fill="#f3e8ff" stroke="#24344b" stroke-width="2"/><text x="988" y="916.0" font-size="22" fill="#24344b">Score COMPLETE designs with the GP</text><text x="988" y="948.0" font-size="19" fill="#24344b">Expected improvement (EI):</text><text x="988" y="972.7" font-size="19" fill="#24344b">predicted upside beyond the best known score.</text><text x="988" y="997.4" font-size="19" fill="#24344b">Branch reward = average EI of its completions.</text><rect x="45" y="880" width="830" height="163" rx="12" fill="#ffedd5" stroke="#24344b" stroke-width="2"/><text x="63" y="916.0" font-size="22" fill="#24344b">4. Send the reward back up the selected path</text><text x="63" y="948.0" font-size="19" fill="#24344b">Increase ancestor visit counts; update their average values.</text><text x="63" y="972.7" font-size="19" fill="#24344b">These are tree statistics. The diffusion model is not retrained.</text><text x="63" y="997.4" font-size="19" fill="#24344b">On the next iteration, selection uses the updated statistics.</text><path d="M963 960L883 960" fill="none" stroke="#c27124" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M45 955L25 955" fill="none" stroke="#c27124" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M25 955L25 393" fill="none" stroke="#c27124" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M25 393L422 393" fill="none" stroke="#c27124" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="45" y="1113.0" font-size="23" fill="#24344b">REPEAT → RETURN THE EXPLORED COMPLETE DESIGNS WITH HIGHEST EI</text><text x="45" y="1155.0" font-size="21" fill="#24344b">Paper settings: depth 4 • 5 children per expansion • 5 completions per child • 16 search iterations</text><text x="45" y="1200.0" font-size="20" fill="#24344b">A partial candidate earns its value through possible completions. GP scores are estimates, not oracle results.</text><text x="45" y="1248.0" font-size="18" fill="#566479">Source: arxiv.org/html/2601.14446v1 — Algorithm 1, §3.2 and §4.3</text></g></svg>