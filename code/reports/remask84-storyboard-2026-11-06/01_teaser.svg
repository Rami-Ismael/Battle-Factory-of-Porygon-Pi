  <g id="text_14">
   <text style="font-weight: 700; font-size: 14px; font-family: 'Helvetica'; text-anchor: start; fill: #0b0b0b" x="10.368" y="22.38" transform="rotate(-0 10.368 22.38)">Remasking missed the bar where it was tested; the paper's own setting is untested</text>
  </g>
  <g id="text_15">
   <text style="font-size: 10px; font-family: 'Helvetica'; text-anchor: start; fill: #52514e" x="10.368" y="45.516" transform="rotate(-0 10.368 45.516)">The paper's rules fill species first here, so they mostly resample set fields. Their real test is random decoding, which has not been battled.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 8px; font-family: 'Helvetica'; fill: #52514e" transform="translate(10.368 456.074162)">Error = mean over asks 4/24, 8/24, 16/24 of (mean got − ask)², minus no remasking's 0.0252; 95% intervals. Near the line is under 0.001. Win rate</text>
   <text style="font-size: 8px; font-family: 'Helvetica'; fill: #52514e" transform="translate(10.368 466.339787)">against the top-50 meta teams, behaviour-cloning policy on both sides, 3 seeds × 64 teams per ask.</text>
  </g>
