    <text style="font-size: 9.5px; font-family: 'Helvetica'; text-anchor: start; fill: #52514e" x="576" y="162.374015" transform="rotate(-0 576 162.374015)">Not planned: least-likely is not the paper's rule</text>
   </g>
   <g id="text_8">
