<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosine learning rate, wrong-stone teams filtered gives held-out teams the fewest nats with the tables on</title>
<style>
:root{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--ink:#f2f1ee;--ink2:#a9a8a2;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;line-height:1.25;margin:0}
h1,.sub,.note{white-space:pre-line}
.sub,.note{color:var(--ink2);margin:4px 0 12px}
.note{font-size:12.5px;margin-top:10px}
#chart{width:100%;height:642px}
</style>
</head>
<body>
<main>
<h1>Cosine learning rate, wrong-stone teams filtered gives held-out teams the fewest nats with the tables on</h1>
<p class="sub">Exact log-likelihood under the species-first sampler, split by field type. Tables off also drops the Stat Point budget.</p>
<div id="chart"></div>
<p class="note">1,024 held-out teams; tables-rejected teams left out.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<script>
const revive = o => typeof o === "string" && o.startsWith("js:") ? (0, eval)("(" + o.slice(3) + ")")
  : Array.isArray(o) ? o.map(revive) : o && typeof o === "object" ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, revive(v)])) : o;
const option = revive({"legend": {"top": 0}, "grid": {"left": 8, "right": 70, "top": 36, "bottom": 40, "containLabel": true}, "tooltip": {"trigger": "axis", "axisPointer": {"type": "shadow"}, "valueFormatter": "js:v => v.toFixed(2) + ' nats'"}, "xAxis": {"type": "value", "name": "nats per held-out team (lower = more likely)", "nameLocation": "middle", "nameGap": 28}, "yAxis": {"type": "category", "data": ["Per-field masking schedule · tables on", "Per-field masking schedule · tables off", "Linear masking schedule · tables on", "Linear masking schedule · tables off", "No tables in the loss, epoch 33 · tables on", "No tables in the loss, epoch 33 · tables off", "Wrong-stone teams filtered · tables on", "Wrong-stone teams filtered · tables off", "Cosine learning rate, wrong-stone teams filtered · tables on", "Cosine learning rate, wrong-stone teams filtered · tables off", "No tables in the loss, 80 epochs · tables on", "No tables in the loss, 80 epochs · tables off"], "inverse": true}, "series": [{"name": "species", "type": "bar", "stack": "nats", "color": "#4269d0", "emphasis": {"focus": "series"}, "data": [19.98, 20.83, 20.11, 20.47, 20.37, 20.45, 20.39, 20.87, 20.2, 20.55, 20.41, 20.55]}, {"name": "ability", "type": "bar", "stack": "nats", "color": "#efb118", "emphasis": {"focus": "series"}, "data": [1.35, 25.96, 1.42, 27.5, 1.57, 8.91, 1.49, 26.25, 1.43, 13.54, 1.48, 1.49]}, {"name": "item", "type": "bar", "stack": "nats", "color": "#ff725c", "emphasis": {"focus": "series"}, "data": [11.74, 21.79, 11.99, 19.79, 13.08, 14.2, 12.24, 17.26, 12.01, 15.3, 12.25, 12.33]}, {"name": "move", "type": "bar", "stack": "nats", "color": "#6cc5b0", "emphasis": {"focus": "series"}, "data": [27.04, 73.69, 28.15, 63.54, 32.69, 52.42, 28.17, 51.43, 27.01, 44.88, 28.24, 29.26]}, {"name": "Stat Alignment", "type": "bar", "stack": "nats", "color": "#a463f2", "emphasis": {"focus": "series"}, "data": [8.39, 8.39, 8.52, 8.52, 8.76, 8.76, 6.91, 6.91, 5.86, 5.86, 5.89, 5.89]}, {"name": "Stat Points", "type": "bar", "stack": "nats", "color": "#9498a0", "emphasis": {"focus": "series"}, "data": [55.56, 72.07, 56.96, 73.81, 58.75, 63.1, 37.38, 78.07, 32.01, 62.61, 33.25, 33.64], "label": {"show": true, "position": "right", "formatter": "js:p => ([124.1, 222.7, 127.2, 213.6, 135.2, 167.8, 106.6, 200.8, 98.5, 162.7, 101.5, 103.2])[p.dataIndex] + ' nats'"}}]}), darkMap = {"#0b0b0b": "#f2f1ee", "#1f1f1e": "#f2f1ee", "#52514e": "#c3c2b7", "#5f5e5a": "#c3c2b7", "#6f6e69": "#a9a8a2", "#fff": "#161615", "#ffffff": "#161615"};
const swap = o => typeof o === "string" ? (darkMap[o.toLowerCase()] || o) : Array.isArray(o) ? o.map(swap)
  : o && typeof o === "object" && typeof o !== "function" ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, swap(v)])) : o;
const el = document.getElementById("chart"), dark = matchMedia("(prefers-color-scheme: dark)");
let chart;
function draw() {
  if (chart) chart.dispose();
  chart = echarts.init(el, dark.matches ? "dark" : null, {renderer: "svg"});
  chart.setOption({backgroundColor: "transparent", ...(dark.matches ? swap(option) : option)});
}
dark.addEventListener("change", draw);
addEventListener("resize", () => chart.resize());
draw();
</script>
</body>
</html>
