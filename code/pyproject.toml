[tool.ruff]
required-version = "==0.17.2"

[tool.ruff.lint]
# ERA: delete commented-out code rather than keep it; git keeps old versions.
# The five comments it misread as code on 2026-10-30 (section banners, a quoted Showdown error) carry "# noqa: ERA001".
select = ["NPY", "TID251", "F", "E9", "ARG", "RUF", "C901", "ERA"]
# F722: jaxtyping shape strings such as " fields" are not Python expressions (jaxtyping's own advice).
# RUF001: look-alike Unicode in strings (×, –, é) is mostly intended output text here.
ignore = ["F722", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Test fakes take the real object's arguments without using them.
"scripts/test_*.py" = ["ARG"]
# Stand-ins for the model take its arguments unused. These two stay byte-identical to their frozen run copies, so they carry no noqa.
"src/trade84.py" = ["ARG002"]
"src/nucleus84.py" = ["ARG002", "RUF012"]

[tool.ruff.lint.mccabe]
# A function scores 1, plus 1 per if, elif, for, while, except, and nested function.
# Functions that already scored above 10 on 2026-10-25 carry "# noqa: C901"; new code stays at 10 or less.
max-complexity = 10

[tool.ruff.lint.flake8-unused-arguments]
# A catch-all *args or **kwargs is there to accept any call, not to be read.
ignore-variadic-names = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch.load".msg = "Use load_checkpoint from src/checkpoints.py, which sets weights_only."
# ECharts replaced matplotlib on 2026-11-09; every chart script in code/ was ported that day (scripts/test_chart_ports.py guards them).
"matplotlib".msg = "Charts use ECharts: build the option dict and call write_chart from src/echarts_chart.py (AGENTS.md, Charts)."
