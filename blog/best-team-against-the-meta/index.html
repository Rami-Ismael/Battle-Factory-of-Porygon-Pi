<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best Team Against the Meta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one team per row. Six sprites carry the identity, the big number carries the result,
   a thin strip under each row puts every score on one shared win-rate axis. Tokens match the article. */
:root {
  --bg:#f5f6f8; --panel:#ffffff; --ink:#14161b; --ink-2:#474d59; --ink-3:#6b7382; --rule:#dadee6; --wash:#eef1f6;
  --same:#2f9e6b; --ahead:#2a78d6; --lost:#d4551f; --focus:#2a78d6;
  --font-body:"Literata",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#111318; --panel:#191c23; --ink:#eceef2; --ink-2:#b6bcc8; --ink-3:#98a0ae; --rule:#2b303a; --wash:#1d2129;
  --same:#3fb17f; --ahead:#4b94ee; --lost:#ef7340; --focus:#6da7ec; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#111318; --panel:#191c23; --ink:#eceef2; --ink-2:#b6bcc8; --ink-3:#98a0ae; --rule:#2b303a; --wash:#1d2129;
  --same:#3fb17f; --ahead:#4b94ee; --lost:#ef7340; --focus:#6da7ec; color-scheme:dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font-ui); }
main { max-width: 60rem; margin: 0 auto; padding-block: 36px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 600 12px/1 var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
h1 { font: 600 clamp(28px, 4.6vw, 40px)/1.15 var(--font-body); margin: 0 0 10px; text-wrap: balance; }
.def { color: var(--ink-2); max-width: 46rem; margin: 0 0 26px; }
.teams { display: grid; gap: 14px; }
.team { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 14px; }
.team.real { border-color: var(--same); box-shadow: inset 4px 0 0 var(--same); }
.top { display: grid; grid-template-columns: 11.5rem minmax(0, 1fr); gap: 16px 22px; align-items: center; }
.kind { font: 600 11px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ahead); }
.real .kind { color: var(--same); }
.name { font: 600 15px/1.3 var(--font-ui); margin: 6px 0 4px; }
.rate { font: 600 44px/1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.rate small { font-size: 22px; }
.sub { font: 13px/1.4 var(--font-mono); color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
.sub span { display: block; white-space: nowrap; }
.six { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.mon { text-align: center; min-width: 0; }
.pic { position: relative; width: 100%; max-width: 88px; margin: 0 auto; aspect-ratio: 1; background: var(--wash); border-radius: 8px; }
.pic img.sp { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.pic img.it { position: absolute; right: -2px; bottom: -2px; width: 34%; height: 34%; background: var(--panel); border: 1px solid var(--rule); border-radius: 50%; padding: 2px; image-rendering: pixelated; }
.mon .sn { font: 500 12px/1.25 var(--font-ui); margin-top: 6px; overflow-wrap: anywhere; }
.mon .in { font: 11px/1.25 var(--font-ui); color: var(--ink-3); overflow-wrap: anywhere; }
.strip { margin-top: 14px; }
.strip svg { width: 100%; height: 26px; display: block; overflow: visible; }
.strip .axis { stroke: var(--rule); stroke-width: 1; }
.strip .ref-real { stroke: var(--same); stroke-width: 1.5; stroke-dasharray: 3 3; }
.strip .ref-avg { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 1 3; }
.strip .whisk { stroke: var(--ink-2); stroke-width: 2; }
.strip .dot { fill: var(--ahead); }
.real .strip .dot { fill: var(--same); }
.strip text { font: 11px var(--font-mono); fill: var(--ink-3); }
details { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
summary { cursor: pointer; font: 500 14px var(--font-ui); color: var(--ahead); }
summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 3px; }
.method { color: var(--ink-2); font-size: 14px; margin: 10px 0 12px; max-width: 46rem; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(13.5rem, 1fr)); gap: 10px; }
.set { background: var(--wash); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; min-width: 0; }
.set b { font-size: 14px; }
.set .k { color: var(--ink-3); }
.set ul { margin: 6px 0 0; padding-left: 16px; }
.src { font: 12px/1.4 var(--font-mono); color: var(--ink-3); margin-top: 10px; overflow-wrap: anywhere; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin: 18px 0 0; }
.legend i { display: inline-block; width: 18px; vertical-align: middle; margin-right: 6px; border-top: 2px dashed var(--same); }
.legend i.avg { border-top: 2px dotted var(--ink-3); }
.legend i.wh { border-top: 2px solid var(--ink-2); }
figcaption { font-size: 14px; color: var(--ink-2); margin-top: 18px; max-width: 46rem; }
figcaption b { color: var(--ink); }
/* Embedded in the article (?embed): the article supplies the title and the caption. */
.embed main { padding-block: 18px 18px; }
.embed .eyebrow, .embed h1, .embed .def, .embed figcaption { display: none; }
@media (max-width: 640px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  .six { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }
  .rate { font-size: 40px; }
}
</style>
</head>

if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
const pct = x => (100 * x).toFixed(1);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const real = DATA.teams.find(t => t.kind === "real");
const LO = 0.50, HI = 0.80;
const X = v => 6 + (v - LO) / (HI - LO) * 88;   // percent of the strip width

function strip(t) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${t.name}: ${pct(t.rate)}% plus or minus ${pct(t.se)}, on a scale from 50% to 80%`);
  const line = (x1, x2, y1, y2, cls) => { const l = document.createElementNS(NS, "line");
    Object.entries({ x1: x1 + "%", x2: x2 + "%", y1, y2 }).forEach(([k, v]) => l.setAttribute(k, v)); l.setAttribute("class", cls); svg.append(l); };
  const text = (x, s, anchor) => { const n = document.createElementNS(NS, "text"); n.setAttribute("x", x + "%"); n.setAttribute("y", 25);
    n.setAttribute("text-anchor", anchor); n.textContent = s; svg.append(n); };
  line(X(LO), X(HI), 9, 9, "axis");
  line(X(DATA.meta_average), X(DATA.meta_average), 2, 16, "ref-avg");
  if (t !== real) line(X(real.rate), X(real.rate), 1, 17, "ref-real");
  line(X(t.rate - t.se), X(t.rate + t.se), 9, 9, "whisk");
  const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", X(t.rate) + "%"); c.setAttribute("cy", 9); c.setAttribute("r", 5); c.setAttribute("class", "dot"); svg.append(c);
  text(X(LO), "50%", "start"); text(X(HI), "80%", "end");
  return svg;
}

const box = document.getElementById("teams");
DATA.teams.forEach(t => {
  const card = el("article", "team" + (t.kind === "real" ? " real" : ""));
  const top = el("div", "top");
  const left = el("div");
  left.append(el("div", "kind", t.kind === "real" ? "Real team · the bar to beat" : "Found by search"),
              el("div", "name", t.name));
  const rate = el("div", "rate"); rate.append(pct(t.rate), el("small", null, "%"));
  const sub = el("div", "sub");
  sub.append(el("span", null, `${t.wins.toLocaleString("en")} / ${t.battles.toLocaleString("en")} battles`), el("span", null, `± ${pct(t.se)} points`));
  left.append(rate, sub);
  const six = el("div", "six");
  t.mons.forEach(m => {
    const mon = el("div", "mon"); const pic = el("div", "pic");
    if (DATA.sprites[m.species]) { const i = el("img", "sp"); i.src = DATA.sprites[m.species]; i.alt = m.species; pic.append(i); }
    if (m.item && DATA.items[m.item]) { const i = el("img", "it"); i.src = DATA.items[m.item]; i.alt = m.item; pic.append(i); }
    mon.append(pic, el("div", "sn", m.species), el("div", "in", m.item || "no item"));
    six.append(mon);
  });
  top.append(left, six);
  const st = el("div", "strip"); st.append(strip(t));
  const det = el("details"); det.append(el("summary", null, "Show the sets"), el("p", "method", t.method));
  const sets = el("div", "sets");
  t.mons.forEach(m => {
    const s = el("div", "set"); s.append(el("b", null, m.species));
    const meta = [["Item", m.item || "none"], ["Ability", m.ability], ["Alignment", m.alignment || "not recorded"], ["Stat Points", m.points || "not recorded"]];
    meta.forEach(([k, v]) => { const d = el("div"); d.append(el("span", "k", k + ": "), v); s.append(d); });
    const ul = el("ul"); m.moves.forEach(mv => ul.append(el("li", null, mv))); s.append(ul);
    sets.append(s);
  });
  det.append(sets, el("div", "src", "Source: " + t.source));
  card.append(top, st, det);
  box.append(card);
});
document.getElementById("avgTxt").textContent = pct(DATA.meta_average) + "%";
const cap = document.getElementById("cap");
cap.append(el("b", null, "Figure 1. "),
  `Each row is one complete team, shown as its six Pokémon with their held items. The top search team won ${pct(DATA.teams[0].rate)}% and the best real team ${pct(real.rate)}%; every search team's score sits within about one standard error of the real team's. An average top-50 team wins ${pct(DATA.meta_average)}% against the other 49. Open a row to see its full sets and where its numbers come from.`);
</script>
