<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mask Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 640px lab column. The explorer comes first (see what changes), then the four
   questions in the order they were asked (measure what helps), then the method notes. */
:root{
  color-scheme:dark;
  --bg:#0b1216;--surface:#111b21;--surface2:#16232a;--surface3:#1d2c34;--line:rgba(255,255,255,.09);
  --ink:#eef3f2;--ink2:#b3c0be;--muted:#7b8a87;
  --accent:#7fe3c6;--accent-ink:#06231b;--warn:#e8b45a;--bad:#ef7d72;
  --a0:#68767a;--a1:#8fa6d1;--a2:#7fe3c6;--a3:#b6a8ff;
  --l1:#6f8fc4;--l2:#a9c0ec;--m1:#9a7a3a;--m2:#b8923f;--m3:#d6ab49;--m4:#f0c663;
  --hatch:rgba(127,227,198,.2);--win:rgba(127,227,198,.22);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f4f6f5;--surface:#fff;--surface2:#eef2f1;--surface3:#e3e9e7;--line:rgba(11,18,22,.12);
  --ink:#0d1a1f;--ink2:#41524f;--muted:#6b7b78;
  --accent:#0d8a6d;--accent-ink:#fff;--warn:#a96f0c;--bad:#c2392d;
  --a0:#aab2b0;--a1:#5c7db5;--a2:#0d8a6d;--a3:#6a55d8;
  --l1:#5c7db5;--l2:#2f5aa0;--m1:#c9a45a;--m2:#b58a2c;--m3:#9a7013;--m4:#7a5604;
  --hatch:rgba(13,138,109,.16);--win:rgba(13,138,109,.18);
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6f5;--surface:#fff;--surface2:#eef2f1;--surface3:#e3e9e7;--line:rgba(11,18,22,.12);
  --ink:#0d1a1f;--ink2:#41524f;--muted:#6b7b78;
  --accent:#0d8a6d;--accent-ink:#fff;--warn:#a96f0c;--bad:#c2392d;
  --a0:#aab2b0;--a1:#5c7db5;--a2:#0d8a6d;--a3:#6a55d8;
  --l1:#5c7db5;--l2:#2f5aa0;--m1:#c9a45a;--m2:#b58a2c;--m3:#9a7013;--m4:#7a5604;
  --hatch:rgba(13,138,109,.16);--win:rgba(13,138,109,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font:700 12px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#5b8cff);display:inline-block}
.tag{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:right}
h1{font-size:44px;line-height:1.04;letter-spacing:-.02em;margin:18px 0 14px;font-weight:700;text-wrap:balance}
h1 em{display:block;color:var(--accent);font:italic 500 46px/1.05 var(--serif)}
.lede{color:var(--ink2);font-size:16px;margin:0 0 14px}
p{margin:0 0 10px}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.howto .card{padding:12px 14px}
.howto b{display:block;font-size:14px;margin-bottom:4px}
.howto p{font-size:13px;color:var(--ink2);margin:0}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 4px;font-size:13px}
.toc a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line)}
.toc a b{color:var(--accent);font-family:var(--mono);font-size:11px;margin-right:4px}
section.q{margin-top:40px;padding-top:22px;border-top:1px solid var(--line)}
section.q>.eyebrow{margin-bottom:6px}
h2{font-size:24px;line-height:1.15;letter-spacing:-.01em;margin:4px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:18px 0 6px}
.answer{font-size:16px;color:var(--ink);margin:0 0 14px;padding-left:12px;border-left:3px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card+.card{margin-top:12px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}
label.f{display:block;min-width:0}
label.f span{display:block;margin-bottom:6px}
select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:600 14px var(--sans);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font:600 12.5px var(--sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg button .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 0}
.kline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
/* team grid */
.mon{padding:10px 0;border-top:1px solid var(--line)}
.mon:first-child{border-top:0;padding-top:4px}
.mon h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;flex-wrap:wrap}
.mon h4 img{width:40px;height:40px;image-rendering:pixelated;margin:-6px 0}
.ph{width:40px;height:40px;border-radius:10px;background:var(--surface2);display:inline-grid;place-items:center;color:var(--muted);font-size:18px;margin:-6px 0}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:5px 8px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;text-align:left;font-family:inherit;cursor:default}
.cell small{font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell img{width:14px;height:14px;image-rendering:pixelated}
.cell.masked{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border:1px dashed var(--accent);color:var(--accent);cursor:pointer}
.cell.filled{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);cursor:pointer}
.cell.rejected{border:1px dashed var(--bad);color:var(--bad);background:repeating-linear-gradient(135deg,rgba(239,125,114,.14) 0 6px,transparent 6px 12px);cursor:pointer}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:12.5px;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{color:var(--muted);font-size:12.5px;margin-top:10px}
.pill{display:inline-block;font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.no{color:var(--bad);border-color:var(--bad)}
.pill.ref{color:var(--muted);border-color:var(--line)}
/* stacked writer rows */
.wrows{display:grid;gap:8px;margin-top:10px}
.wrow{display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;min-width:0;width:100%}
.wrow[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wrow .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrow .head b{font-weight:600}
.wrow .head .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.wrow .fills{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--ink2)}
.wrow .fills span{display:inline-flex;gap:5px;align-items:center;min-width:0}
.wrow .fills small{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wrow .fills img{width:14px;height:14px;image-rendering:pixelated}
.wrow .err{font-size:12.5px;color:var(--bad);overflow-wrap:anywhere}
.wrow .score{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.wrow .score b{color:var(--ink);font-family:var(--mono);font-weight:600}
.track{grid-column:1/-1;height:8px;border-radius:5px;background:var(--surface3);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.insp{margin-top:12px;background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13.5px}
.insp table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.insp td{padding:4px 6px 4px 0;vertical-align:top;border-top:1px solid var(--line)}
.insp td:first-child{color:var(--muted);width:46%}
.insp tr:first-child td{border-top:0}
/* constellation */
.stars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.star{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:4px;cursor:pointer;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1px;align-content:center;position:relative}
.star img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;opacity:.5}
.star.win{border-color:var(--accent);background:var(--win)}
.star.win img{opacity:1}
.star.none{border-style:dashed}
.star.sel{outline:2px solid var(--ink);outline-offset:1px}
.star .twice{position:absolute;right:3px;top:1px;font:700 9px var(--mono);color:var(--muted)}
.opp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.opp img{width:36px;height:36px;image-rendering:pixelated}
/* charts */
.rows{display:grid;gap:10px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:13.5px}
.row b{font-weight:600}
.row .v{font-family:var(--mono);font-weight:600;color:var(--ink);text-align:right}
.row .v small{color:var(--muted);font-weight:400;margin-left:6px}
.ivals{display:grid;gap:8px;margin-top:12px}
.ival{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:13px}
@media (max-width:460px){.ival{grid-template-columns:1fr 1fr}.ival .axis{grid-column:1/-1}}
.ival .lab{font-weight:600}
.ival .lab small{display:block;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:11px}
.axis{position:relative;height:26px;border-radius:5px;background:var(--surface2)}
.axis .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--muted)}
.axis .ci{position:absolute;top:10px;height:6px;border-radius:3px;background:var(--ink2);opacity:.6}
.axis .pt{position:absolute;top:7px;width:12px;height:12px;border-radius:50%;margin-left:-6px;background:var(--ink)}
.ival.clear .ci{background:var(--accent);opacity:.75}.ival.clear .pt{background:var(--accent)}
.ival .val{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--ink)}
.ival .val small{display:block;color:var(--muted);font-size:10.5px;font-family:var(--sans)}
.axis-ticks{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-top:4px;padding:0 120px 0 130px}
@media (max-width:460px){.axis-ticks{padding:0}}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.big .card{padding:12px 14px}
.big .v{font:700 28px/1.1 var(--mono);letter-spacing:-.01em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.big .v.good{color:var(--accent)}
.big .s{font-size:12px;color:var(--muted)}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px;font-size:12.5px}
.four div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.four b{display:block;font:700 20px/1.1 var(--mono);margin-bottom:2px}
.four .on{color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl th{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
.tscroll{overflow-x:auto;max-width:100%}
.reasons{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.reasons li{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline}
.reasons li b{font-family:var(--mono);color:var(--bad);text-align:right}
.choices{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.choice{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface3);border-radius:8px;padding:3px 7px;font-size:12px;color:var(--ink)}
.choice img{width:18px;height:18px;image-rendering:pixelated}
.choice b{font:600 10.5px var(--mono);color:var(--muted)}
.dv{font-size:12.5px;color:var(--ink2)}
.dv b{color:var(--ink);font-family:var(--mono);font-weight:600}
#div-rows .row{padding-bottom:6px;border-bottom:1px solid var(--line)}
#div-rows .row:last-child{border-bottom:0}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;padding:6px 0}
details p,details li{color:var(--ink2);font-size:13.5px}
details ul{padding-left:18px;margin:6px 0}
details li{margin-bottom:6px}
footer{margin-top:28px;color:var(--muted);font-size:12.5px;line-height:1.55;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:480px){.howto,.big,.ctl{grid-template-columns:1fr}h1{font-size:36px}h1 em{font-size:38px}}
@media (prefers-reduced-motion:reduce){.track i{animation:none}}
</style>
</head>

  if (/invalid item|invalid move|does not exist/.test(msg)) return 'An item or move that does not exist';
  return 'Other validator rejection';
}
function q3() {
  const m = DATA.mercury; if (!m || !m.final) return '';
  const vs = m.final.versus_off;
  const bars = EFFORTS.map((e, i) => { const x = m.arms[e];
    return `<div class="row"><b>Reasoning ${e}</b><span class="v num">${pct(x.legal / x.returned, 0)}<small>${x.legal}/420 · $${x.cost.toFixed(2)} · ${x.reasoning_tokens ? (x.reasoning_tokens / 1000).toFixed(0) + 'k reasoning tokens' : 'no reasoning tokens'}</small></span><div class="track"><i style="width:${x.legal / x.returned * 100}%;background:var(--m${i + 1})"></i></div></div>`; }).join('');
  const lg = EFFORTS.slice(1).map(e => ivalRow(`${e} − off`, 'legality', vs[e].legality_delta.mean, vs[e].legality_delta.low, vs[e].legality_delta.high, `${vs[e].legality_delta.pairs} masks`, 14)).join('');
  const bt = EFFORTS.slice(1).map(e => ivalRow(`${e} − off`, 'battles', vs[e].win_rate_delta_both_legal.mean, vs[e].win_rate_delta_both_legal.low, vs[e].win_rate_delta_both_legal.high, `${vs[e].win_rate_delta_both_legal.pairs} masks both legal`, 1.6)).join('');
  const seg = EFFORTS.map(e => `<button data-effort="${e}" aria-pressed="${e === 'high'}">${e}</button>`).join('');
  const cost = Object.values(m.audit.arms).reduce((n, a) => n + a.cost_usd, 0);
  const cached = Object.values(m.arms).reduce((n, a) => n + a.cached_tokens, 0) / Object.values(m.arms).reduce((n, a) => n + a.prompt_tokens, 0);
  return `<section class="q" id="q3"><div class="eyebrow">Question 3 · Mercury 2.5 · reasoning off, low, medium, high</div><h2>Does more reasoning help Mercury?</h2>
    <p class="answer">More reasoning buys legality, a few points per step, at four times the cost. The battle result does not move.</p>
    <p>Mercury is Inception's diffusion language model, a different system from the project's Pokémon diffusion model. Same 420 masks, same cap, pinned to Inception. The three reasoning efforts are paired against the off arm.</p>
    <div class="card"><div class="eyebrow">Legal fills out of 420, by effort</div><div class="rows">${bars}</div></div>
    <div class="card"><div class="eyebrow">Legality, each effort minus off</div><div class="ivals">${lg}</div><div class="axis-ticks"><span>−14 pp</span><span>0</span><span>+14 pp</span></div>
      <div class="eyebrow" style="margin-top:18px">Battles, each effort minus off</div><div class="ivals">${bt}</div><div class="axis-ticks"><span>−1.6 pp</span><span>0</span><span>+1.6 pp</span></div>
      <p class="note">Same reading as question 1: pairs are masks both arms filled legally; intervals are 95% starter bootstraps; green excludes zero.</p></div>
    <div class="card"><div class="kline"><div class="eyebrow">Why Mercury's answers were rejected</div><div class="seg" id="effort-seg">${seg}</div></div><ul class="reasons" id="reasons"></ul></div>
    <details><summary>Cost and telemetry</summary>
      <p>Recorded API cost across the four arms: $${cost.toFixed(2)}, with five responses lacking cost records and two original timed-out calls of unknown charge. Prompt caching covered about ${pct(cached, 0)} of input tokens. Eight preflight probes confirmed that off reports zero reasoning tokens and the other levels report increasing budgets; they are excluded from the study.</p>
      <p>Median call time: ${EFFORTS.map(e => `${e} ${m.audit.arms[e].median_elapsed_seconds.toFixed(1)} s`).join(', ')}. Concurrency changed from four to two mid-study, so these are descriptive, not a speed benchmark.</p></details></section>`;
}
function updateReasons() {
  const m = DATA.mercury; if (!m || !m.final) return;
  const e = $('#effort-seg [aria-pressed="true"]').dataset.effort, f = m.final.arms[e].failures || {};
  const g = {}; for (const [msg, n] of Object.entries(f)) g[reasonGroup(msg)] = (g[reasonGroup(msg)] || 0) + n;
  const total = Object.values(g).reduce((a, b) => a + b, 0);
  $('#reasons').innerHTML = Object.entries(g).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<li><b>${n}</b><span>${esc(k)}</span></li>`).join('') + `<li><b>${total}</b><span style="color:var(--muted)">rejected of 420 at effort ${esc(e)}</span></li>`;
}
/* ---------- question 4: do the writers keep writing the same thing? ---------- */
const META = new Set(DATA.opponents.flatMap(o => o.species));
const DIV = {study: X20 ? '20' : '5', fam: 'pokemon'};
const trialF = {}; if (S20) S20.trials.forEach(t => { trialF[t.id] = t.f; });
const DIVFAM5 = {pokemon:'Whole Pokémon', items:'Items', moves:'Moves', abilities:'Abilities', natures:'Stat Alignment', stats:'Stat Points'};
const divX = () => DIV.study === '20' ? X20 : X5;
const divFams = () => DIV.study === '20' ? Object.fromEntries(Object.entries(S20.families).filter(([f]) => f !== 'mixed')) : DIVFAM5;
const flat = v => v == null ? null : typeof v === 'object' ? (v.species ? v.species : spread(v)) : String(v);
function fillsOf(fam, wkey) { // every value a writer wrote into a legal fill of this family
  const out = [];
  if (DIV.study === '5') {
    for (const t of DATA.tasks) { if (t.f !== fam) continue; const r = res(t), src = wkey === 'random' ? r.random : r.arms[wkey];
      if (!src || !src.fill || (wkey !== 'random' && !src.ok)) continue; src.fill.forEach(v => out.push(flat(v))); }
  } else {
    for (const [k, rec] of Object.entries(S20.results)) { if (trialF[k.split('/r')[0]] !== fam) continue; const src = rec[wkey];
      if (!src || !src.ok || !src.fill) continue; src.fill.forEach(v => out.push(flat(v))); }
  }
  return out.filter(v => v != null);
}
function divStats(fam, wkey) {
  const vals = fillsOf(fam, wkey);
  const c = new Map(); vals.forEach(v => c.set(v, (c.get(v) || 0) + 1));
  const top = [...c.entries()].sort((a, b) => b[1] - a[1]);
  const meta = fam === 'pokemon' && vals.length ? vals.filter(v => META.has(v)).length / vals.length : null;
  return {n: vals.length, distinct: c.size, top, meta};
}
function divRow(label, c, st, fam) {
  if (!st.n) return `<div class="row"><b>${dot(c)}${esc(label)}</b><span class="v num"><small>no legal fills</small></span></div>`;
  const isItem = fam === 'items' || fam === 'item';
  const chips = st.top.slice(0, 8).map(([v, n]) => { const im = fam === 'pokemon' ? sprite(v) : isItem ? SPRITES['item-' + norm(v)] : null;
    return `<span class="choice">${im ? `<img src="${im}" alt="">` : ''}${esc(v)}<b>×${n}</b></span>`; }).join('');
  const share = st.top[0][1] / st.n;
  return `<div class="row"><b>${dot(c)}${esc(label)}</b><span class="v num">${st.distinct} distinct<small>of ${st.n} fills</small></span><div class="track"><i style="width:${st.distinct / st.n * 100}%;background:${c}"></i></div>
    <div class="dv" style="grid-column:1/-1">largest share <b>${pct(share, 0)}</b> (${esc(st.top[0][0])})${st.meta != null ? ` · in the meta pool <b>${pct(st.meta, 0)}</b>` : ''}</div>
    <div class="choices" style="grid-column:1/-1">${chips}${st.top.length > 8 ? `<span class="choice"><b>+${st.top.length - 8} more</b></span>` : ''}</div></div>`;
}
function divControls() {
  const fams = divFams();
  if (!fams[DIV.fam]) DIV.fam = 'pokemon';
  const seg = [X20 && ['20', 'Reasoning studies · 20 starting teams'], ['5', 'Earlier grid · 5 starting teams']].filter(Boolean)
    .map(([k, l]) => `<button data-divstudy="${k}" aria-pressed="${DIV.study === k}">${l}</button>`).join('');
  const opts = Object.entries(fams).map(([f, l]) => `<option value="${f}" ${DIV.fam === f ? 'selected' : ''}>${esc(l)}</option>`).join('');
  return `<div class="seg" style="margin-bottom:12px">${seg}</div><label class="f"><span class="eyebrow">What was masked</span><select id="div-family">${opts}</select></label>`;
}
function updateDiversity() {
  const X = divX(), fam = DIV.fam;
  $('#div-ctl').innerHTML = divControls();
  const rows = X.arms.map(a => divRow(a.short, a.c, divStats(fam, a.key), fam));
  if (DIV.study === '5') rows.push(divRow('Random legal fill', 'var(--muted)', divStats(fam, 'random'), fam));
  $('#div-rows').innerHTML = rows.join('');
  $('#div-note').textContent = (fam === 'pokemon' ? 'The bar is distinct choices over legal fills, the project\'s unique fraction. "In the meta pool" is the share of written species that appear in one of the 49 opponent teams. '
    : fam === 'stats' ? 'Spreads compare exactly. ' : 'The bar is distinct choices over legal fills, the project\'s unique fraction. ')
    + (DIV.study === '20' ? 'Three repeats of each mask count separately, so a writer that answers the same mask the same way three times shows up as repetition. Mixed masks are left out because their values span every field.' : 'A writer with few legal fills has little room to repeat itself; the random fill draws fresh every time.');
}
function qDiv() {
  const keep = DIV.study; DIV.study = X20 ? '20' : '5';
  const X = divX(), ling = X.arms.find(a => a.key === (X20 ? 'ling@on' : 'regmb@16384')), diff = X.arms.find(a => a.key === 'diffusion@v3');
  const L = divStats('pokemon', ling.key), D = divStats('pokemon', diff.key);
  DIV.study = keep;
  return `<section class="q" id="q4"><div class="eyebrow">Question 4 · both studies · what the writers actually wrote</div><h2>Do the writers keep writing the same thing?</h2>
    <p class="answer">Yes, each in its own way. Asked for a whole Pokémon, ${esc(ling.short)} writes a meta species ${pct(L.meta, 0)} of the time and leans on ${esc(L.top[0][0])} (${L.distinct} species over ${L.n} fills); the diffusion model draws from ${D.distinct} species, ${pct(D.meta, 0)} of them meta.</p>
    <p>Diversity matters because the search loop that will use a writer needs many different teams, not one good one. This counts every legal fill: how many distinct values a writer produced, and how much of its output its single most common choice takes. The two studies are shown separately and never pooled.</p>
    <div class="card"><div id="div-ctl"></div><div class="rows" id="div-rows"></div><p class="note" id="div-note"></p></div></section>`;
}
/* ---------- question 5: verdict ---------- */
function q4() {
  if (!NEW) return '';
  const rows = NEW.methods.map(m => `<tr><td>${dot(MCOL[m.id])}${esc(m.name)}</td><td class="n">${m.legal}/420</td><td class="n">${pct(m.full_set.legal_win_rate, 1)}</td><td class="n">${m.id === 'diffusion' ? 'none' : '$' + m.cost.toFixed(2) + (m.cost_coverage < 420 ? '*' : '')}</td></tr>`).join('');
  return `<section class="q" id="q5"><div class="eyebrow">Question 5 · all seven writers</div><h2>So which writer should fill a mask?</h2>
    <p class="answer">The Pokémon diffusion model: always legal, free to run, and level with the best language-model setting in battle. Reasoning in a language model is a legality lever, not a strength lever.</p>
    <div class="card"><div class="tscroll"><table class="tbl"><thead><tr><th>Writer</th><th>Legal</th><th>Win rate, own legal fills</th><th>API cost</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="note">Win rate is the share of a team's ${BATTLES} battles it wins against the top-49 meta pool, with the behaviour-cloning policy on both sides. Each writer is scored on its own legal fills, so this column is descriptive, not a ranking; the paired charts above are the ranking. *Three medium and two high cost records are missing.</p></div>
    <p>Two things keep every number here small. The starting teams are random legal teams, and a random team loses almost every battle against the meta: the median panel wins one of ${BATTLES}. And one panel is noisy by several points, so a single mask proves nothing; only the paired differences over 420 masks do.</p></section>`;
}
/* ---------- page ---------- */
function header() {
  return `<header class="top"><div class="brand"><i></i>Porygon-Pi / Mask Lab</div><div class="tag">Reg M-B · behaviour cloning<br>on both sides</div></header>
    <div class="eyebrow" style="margin-top:14px">Masked team completion · Experiment 002</div>
    <h1>See what changes. <em>Measure what helps.</em></h1>
    <p class="lede">Take a random legal Regulation M-B team. Hide one part of it: an item, an ability, a move, a Stat Point spread, or a whole Pokémon. Ask a writer to fill the gap. Check the answer with the Showdown validator, then play the completed team against the frozen top-49 meta pool.</p>
    <div class="howto"><div class="card"><b>See what changes</b><p>The explorer shows the masked team once and every writer's fill underneath it, cell by cell, with the validator's reason when a fill is rejected.</p></div>
      <div class="card"><b>Measure what helps</b><p>Every legal fill plays ${BATTLES} battles, one per meta team. Its win rate is compared with the other writers' fills of the same mask; the earlier grid also compares it with the untouched team and a random legal fill.</p></div></div>
    <div class="toc"><a href="#explorer"><b>0</b>Explorer</a><a href="#q1"><b>1</b>Ling or diffusion?</a><a href="#q2"><b>2</b>Does reasoning help Ling?</a><a href="#q3"><b>3</b>Does more reasoning help Mercury?</a><a href="#q4"><b>4</b>Same thing again?</a><a href="#q5"><b>5</b>Verdict</a><a href="#method"><b>§</b>Method</a></div>`;
}
function explorerIntro() {
  return `<section class="q" id="explorer"><div id="xhead"></div>`;
}
function method() {
  return `<section class="q" id="method"><div class="eyebrow">Method</div><h2>What is fixed, and what the numbers mean</h2>
    <details open><summary>Battles and scoring</summary><ul>
      <li>Policy: ${esc(DATA.policy)}. No random-action play anywhere.</li>
      <li>A panel is ${BATTLES} battles: one against each of ${DATA.opponents.length} distinct top meta teams, with one team counted twice. Win rate is wins over ${BATTLES}. Simulator randomness is not fixed, so one panel is noisy by several points.</li>
      <li>Regulation: Champions VGC 2026 Reg M-B, Showdown validator, first attempt only. No retries, repairs or best-of selection.</li>
      <li>Paired differences subtract, for each mask, one writer's win rate from another's. Intervals resample the starting teams (4,000 draws, starters weighted equally, repeats kept together) and are not adjusted for the number of comparisons.</li></ul></details>
    <details><summary>The two studies</summary><ul>
      <li>Explorer grid (2026-10-08): 5 random legal starting teams, 6 mask families, every mask size, one sample per writer, 270 masks. Ling via OpenRouter routed to Novita, temperature 0.7, JSON mode off. Diffusion v3: F1 + G2 ensemble, ask 0.5, guidance 2, temperature 1; Stat Points copied from a same-species corpus spread or drawn at random.</li>
      <li>Reasoning studies (2026-10-12 and 2026-10-13): 20 fresh starting teams, the 7 largest families including mixed masks, 3 repeats, 420 masks per writer. Ling off/on, Mercury off/low/medium/high, diffusion with three generation seeds. The two studies share the opponent pool and the policy checkpoint but not starters, harness or seeds; nothing is pooled across them. The 20 starting teams were never battled untouched, so the reasoning-study explorer has no untouched baseline, and a different meta team is the one counted twice in its panels.</li>
      <li>The language models see all 49 opponent pastes in the prompt; diffusion sees only the known categorical fields. The largest species overlap between any fill and any meta team is 4 of 6, so no fill copies a meta team.</li></ul></details>
    <details><summary>What this page does not claim</summary><ul>
      <li>Not a live-meta or held-out result: the opponent pool is frozen and visible in the prompts.</li>
      <li>Not an equal-input architecture test: the writers are complete systems with different inputs and decoders.</li>
      <li>Not a cost comparison: API costs are recorded totals; diffusion's local compute is unmeasured.</li>
      <li>Repeated cached panels count as battles represented, not as independent evidence.</li></ul></details></section>`;
}
function boot() {
  const day = s => esc((s || '').slice(0, 10));
  $('#app').innerHTML = `${header()}${explorerIntro()}<div id="ctl"></div><div id="grid" style="margin-top:12px"></div><div id="writers" style="margin-top:12px"></div><div id="stars" style="margin-top:12px"></div></section>
    ${q1()}${q2()}${q3()}${qDiv()}${q4()}${method()}
    <footer>Explorer: the reasoning studies by default, the 2026-10-08 grid behind the study toggle. Reasoning studies verified ${day(DATA.reasoning && DATA.reasoning.audit.verified_at)} (Ling), ${day(DATA.mercury && DATA.mercury.audit.verified_at)} (Mercury) and ${day(DATA.matchedDiffusion && DATA.matchedDiffusion.audit.verified_at)} (diffusion). Sprites from Pokémon Showdown.</footer>`;
  $('#ctl').innerHTML = controls();
  renderExplorer();
  updateReasoningFamily(false);
  updateReasons();
  updateDiversity();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.study) { if (S.study === b.dataset.study) return; S.study = b.dataset.study; S.sel = null; S.opp = null; S.show = 'writer'; $('#ctl').innerHTML = controls(); }
  else if (b.dataset.rep != null) { X20.st.rep = +b.dataset.rep; S.sel = null; $('#ctl').innerHTML = controls(); }
  else if (b.dataset.writer != null) { cur().st.writer = +b.dataset.writer; S.show = 'writer'; }
  else if (b.dataset.show) S.show = b.dataset.show;
  else if (b.dataset.opp != null) S.opp = +b.dataset.opp;
  else if (b.dataset.path) S.sel = S.sel === b.dataset.path ? null : b.dataset.path;
  else if (b.dataset.divstudy) { DIV.study = b.dataset.divstudy; updateDiversity(); return; }
  else if (b.dataset.effort) { $('#effort-seg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); updateReasons(); return; }
  else return;
  renderExplorer();
});
document.addEventListener('change', e => {
  if (e.target.id === 'reasoning-family') { updateReasoningFamily(!reduceMotion); return; }
  if (e.target.id === 'div-family') { DIV.fam = e.target.value; updateDiversity(); return; }
  const C = cur();
  if (e.target.id === 'fam') { C.st.family = e.target.value; if (C.key === '5') C.st.k = Math.min(C.st.k, kmax(C.st.family)); S.sel = null; S.opp = null; $('#ctl').innerHTML = controls(); renderExplorer(); }
  else if (e.target.id === 'start') { C.st.start = +e.target.value; S.sel = null; S.opp = null; renderExplorer(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'k') { X5.st.k = +e.target.value; S.sel = null; $('#kv').textContent = 'k = ' + X5.st.k; renderExplorer(); }
});
window.MASKLAB = {DATA, S, X5, X20, cur, renderExplorer};
boot();
</script>
