      opacity: calc(1 - var(--pz-progress) * var(--pz-sibling-fade)); }
    .parallax-zoom-card[data-pz-focus="true"] { z-index: 10; transform: translate3d(0, 0, 0) scale(calc(1 + var(--pz-progress) * (var(--pz-focus-scale) - 1))); opacity: 1; }

  <script>
    (function () {
      const grid = document.getElementById("contest-grid");
      const cards = Array.from(grid.querySelectorAll(".parallax-zoom-card"));
      const focal = cards.find((c) => c.dataset.pzFocus === "true");
      const fr = Number(focal.dataset.pzRow), fc = Number(focal.dataset.pzCol), push = 900;
      cards.forEach((card) => {
        if (card === focal) return;
        const dc = Number(card.dataset.pzCol) - fc, dr = Number(card.dataset.pzRow) - fr;
        card.style.setProperty("--pz-dx", dc * push + "px");
        card.style.setProperty("--pz-dy", dr * push + "px");
      });
    })();
    const tl = gsap.timeline({ paused: true });
    const dim = (n, t) => tl.fromTo("#i-" + n, { opacity: 1 }, { opacity: 0.22, duration: 0.3, ease: "power2.out" }, t);
    const strike = (n, t) => {
      tl.fromTo("#k-" + n, { scaleX: 0, rotation: -8, transformOrigin: "left center" }, { scaleX: 1, duration: 0.28, ease: "power2.out" }, t);
      dim(n, t + 0.1);
    };
    tl.set("#contest-grid .strike", { scaleX: 0, rotation: -8, transformOrigin: "left center" }, 0);

    // Round one: the two directions without a pi go dark. No reason was recorded, so no strike.
    dim("01", 2.8);
    dim("02", 3.05);
    // Tiles, hexagon and bird lose to the facets.
    strike("03", 6);
    strike("05", 6.25);
    strike("06", 6.5);
    // The losers drop out and the four faceted pis regroup into a 2 x 2.
    tl.to(["#s-01", "#s-02", "#s-03", "#s-05", "#s-06"], { opacity: 0, y: 30, scale: 0.96, duration: 0.35, ease: "power3.in", stagger: 0.04 }, 9);
    const S = 1.4483;
    [["04", 86, -231], ["04b", 220, -231], ["04c", -526, 209], ["04d", 526, -97]].forEach(([n, x, y], i) => {
      tl.fromTo("#s-" + n, { x: 0, y: 0, scale: 1 }, { x, y, scale: S, duration: 0.9, ease: "power3.inOut" }, 9.3 + i * 0.05);
    });
    // No feet reads 77; short legs read as bunting.
    strike("04", 12.2);
    strike("04c", 15);
    strike("04d", 15.25);
    // 04b takes the frame.
    tl.to(["#s-04", "#s-04c", "#s-04d"], { opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 17.8);
    tl.fromTo("#s-04b", { x: 220, y: -231 }, { x: 0, y: -11, duration: 1.0, ease: "power3.inOut", immediateRender: false }, 18);
    tl.fromTo("#contest-grid", { "--pz-progress": 0 }, { "--pz-progress": 1, duration: 1.0, ease: "power3.inOut" }, 18);
    tl.set({}, {}, 19.2);
    window.__timelines["contest"] = tl;
