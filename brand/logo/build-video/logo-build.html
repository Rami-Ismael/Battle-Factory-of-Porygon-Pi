<script>
// Geometry, as in brand/logo/04b-faceted-pi-two-feet/build.mjs.
const U = 100, S = Math.sqrt(3) / 2 * U;
const GAP = U / 8;
const POINT_OVERSHOOT = 0.02 * 4 * S;
const P = (a, b) => [a * U + b * U / 2, b * S];
const add = (p, q) => [p[0] + q[0], p[1] + q[1]], mul = (p, s) => [p[0] * s, p[1] * s];
const D = (a, b) => [[a, b], [a + 1, b], [a, b + 1]];
const Up = (a, b) => [[a, b], [a, b + 1], [a - 1, b + 1]];
const cells = [];
for (let a = 0; a < 6; a++) cells.push(D(a, 0));
for (let a = 1; a < 6; a++) cells.push(Up(a, 0));
for (const a0 of [1, 3]) for (let k = 0; k < 3; k++) cells.push(D(a0 - k, 1 + k), Up(a0 - k, 1 + k));
cells.push(Up(2, 3), D(-2, 3));
const rho = U / (2 * Math.sqrt(3));
const BAR_FACETS = 11;
const PINK = [0xE8, 0x60, 0x7F], BLUE = [0x2F, 0x8F, 0xC9], INK = [0x11, 0x11, 0x11], PALE = [0xDA, 0xD7, 0xCF];
const WORD_LIT = [0x11, 0x11, 0x11], WORD_DIM = [0xBD, 0xB9, 0xAF];

// One facet at a given gap, tip overshoots and appear scale.
const incentre = c => mul(c.map(([a, b]) => P(a, b)).reduce(add), 1 / 3);
function facet(c, gap, leftTip, rightTip, scale = 1) {
  const ends = { '0,0': [-leftTip, 0], '6,0': [rightTip, 0] };
  const I = incentre(c);
  const shrink = (rho - gap / 2) / rho * scale;
  return c.map(([a, b]) => add(I, mul(add(add(P(a, b), ends[`${a},${b}`] ?? [0, 0]), mul(I, -1)), shrink)));
}
const finalFacets = cells.map(c => facet(c, GAP, POINT_OVERSHOOT, POINT_OVERSHOOT));
const allPts = finalFacets.flat();
const bx0 = Math.min(...allPts.map(p => p[0])), bx1 = Math.max(...allPts.map(p => p[0]));
const by0 = Math.min(...allPts.map(p => p[1])), by1 = Math.max(...allPts.map(p => p[1]));
// The numbers the final SVG writes, for checking this page against mark-color.svg.
window.finalPathCoords = () => finalFacets.map(t => t.map(p => [+(p[0] - bx0 + 2).toFixed(2), +(p[1] - by0 + 2).toFixed(2)]));

// Camera: screen = focus + k * zoom * (world - centre).
const MARK_W = 860, k = MARK_W / (bx1 - bx0);
const markC = [(bx0 + bx1) / 2, (by0 + by1) / 2];
const screenHome = [540, 650], screenTipL = [340, 400], screenTipR = [740, 400];
const tipL = P(0, 0), tipR = P(6, 0);
const homeOf = p => [screenHome[0] + k * (p[0] - markC[0]), screenHome[1] + k * (p[1] - markC[1])];
const homeTipL = homeOf(tipL), homeTipR = homeOf(tipR);

// Closed-form critically damped spring.
const spring = (t, t0, w = 14) => { const tau = Math.max(0, t - t0); return 1 - (1 + w * tau) * Math.exp(-w * tau); };

// Liang-Barsky clip, as in brand/logo/lib.mjs.
function clip(a, b, r) {
  const [x0, y0, x1, y1] = r, dx = b[0] - a[0], dy = b[1] - a[1];
  let t0 = -1e9, t1 = 1e9;
  for (const [p, q] of [[-dx, a[0] - x0], [dx, x1 - a[0]], [-dy, a[1] - y0], [dy, y1 - a[1]]]) {
    if (p === 0) { if (q < 0) return null; continue; }
    const v = q / p; if (p < 0) t0 = Math.max(t0, v); else t1 = Math.min(t1, v);
  }
  return t0 > t1 ? null : [[a[0] + t0 * dx, a[1] + t0 * dy], [a[0] + t1 * dx, a[1] + t1 * dy]];
}
const e = 0.15 * (by1 - by0), frame = [bx0 - e, by0 - e, bx1 + e, by1 + e];
const range = (lo, hi) => Array.from({ length: hi - lo + 1 }, (_, i) => lo + i);
const family = (makeLine, ids, t0) => {
  const segs = ids.map(makeLine).map(([a, b]) => clip(a, b, frame)).filter(Boolean);
  return segs.map((s, i) => ({ s, start: t0 + 0.26 * i / Math.max(1, segs.length - 1) }));
};
const latticeLines = [
  ...family(a => [P(a, 0), P(a, 1)], range(-12, 12), 10.0),         // 60 degree lines
  ...family(s => [P(s, 0), P(s - 1, 1)], range(-12, 12), 10.5),     // 120 degree lines
  ...family(b => [P(0, b), P(1, b)], range(0, 4), 11.0),            // horizontal lines
];

const NS = 'http://www.w3.org/2000/svg', $ = id => document.getElementById(id);
const facetEls = cells.map(() => $('facets').appendChild(document.createElementNS(NS, 'polygon')));

// When each facet appears.

// Which words of the name are lit: [Battle Factory, Porygon, Pi].

// Plain line holds for several beats, the code line changes per beat.
const plainCaps = [
  [0, "Porygon's colours, π's shape"],
  [1.0, 'π is the symbol for a policy'],
  [3.0, 'A policy picks the move in a battle'],
  [4.0, 'The Battle Factory rents you a team'],
  [7.0, 'Pick a team, then battle with it'],
  [8.0, 'We search for the team. π plays it.'],

  [11.5, 'Every length comes from one unit'],
  [12.5, 'One bar, two legs'],
  [14.0, 'Two legs, no feet: it reads 77'],
  [15.0, 'The feet turn outward'],
  [15.5, '25 facets: now it reads π'],
  [16.5, 'Open a gap between the facets'],
  [17.0, '60° points read short'],
  [19.0, 'Porygon is a Pokémon made of polygons'],
  [20.5, "Pink and blue: Porygon's two tones"],
  [22.0, "Porygon's colours, π's shape"],

  [15.0, 'Up(2, 3)'],
  [15.5, 'D(-2, 3)'],
  [16.5, 'GAP = U / 8'],
  [17.0, ''],

  [18.5, ''],
  [19.5, "PINK = '#E8607F'"],
  [20.0, "BLUE = '#2F8FC9'"],
  [20.5, ''],

const makeCaps = (list, cls, inner) => list.map(([t0, text]) => {

  el.className = cls;
  if (inner) { const span = document.createElement('div'); span.className = inner; span.textContent = text; el.appendChild(span); }

const plainEls = makeCaps(plainCaps, 'cap', 'plain'), codeEls = makeCaps(codeCaps, 'capcode');
function placeCaps(list, t) {
  list.forEach(({ t0, el }, i) => {
    const next = list[i + 1]?.t0 ?? Infinity;
    const enter = t0 === 0 ? 1 : Math.min(1, Math.max(0, (t - t0 - 0.05) / 0.14));
    const exit = Math.min(1, Math.max(0, (t - next) / 0.05));

const lerp3 = (a, b, m) => a.map((v, i) => v + (b[i] - v) * m);
const rgb = c => `rgb(${c.map(v => Math.round(v)).join(',')})`;
const pointsAttr = pts => pts.map(p => `${p[0].toFixed(3)},${p[1].toFixed(3)}`).join(' ');

const GROUND = 880, FACTORY_W = 660, FACTORY_H = 510;
// Six rental Poké Balls in the glass panels; the player picks three of the six.
const BALL_SIZE = 42, ballAt = i => [210 + 3 * (45.5 + 25 * i), 442 + 3 * 56];
const PICKED = [[1, 7.0], [3, 7.33], [4, 7.66]];
const ballEls = Array.from({ length: 6 }, (_, i) => {
  const [cx, cy] = ballAt(i), dim = document.createElementNS(NS, 'image'), lit = document.createElementNS(NS, 'image');
  for (const [el, src] of [[dim, 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXklEQVR4nJ3SwQkAIAgFUPffpE4N46llDCIl5GuS8E/6hEKiuOSkXBu0PnaqCwz4ZDhEGX6iCKOm+Pd6CIe10BLFwjzL8Jolwxo07HoEYRb4sz/oiUvXcy/4vtmouQBgxSUuqGY7FwAAAABJRU5ErkJggg=='], [lit, 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAXUlEQVR4nJ3SSwoAIAgEUC/XpvsfogO4N5CMkPFDwqz0CYVEcclJuxSsMTXdBRf4ZDhEGS5RhFFT/Hs9hMNWaIlhYeY2fGbpYgsadj2CMAv82R9U4tb1vAu+bzZqbuRuHoqvZgMhAAAAAElFTkSuQmCC']]) {

// Trainer sprites are 80 px squares at 3x, with their feet 8 px above the bottom of the square.
function placeSprite(id, cx, feet, size, scale, opacity) {

  el.setAttribute('x', cx - w / 2); el.setAttribute('y', feet - w * 0.97);

window.DURATION = 24;
window.seek = function seek(t) {
  // Facets vanish before the gap, tips and pale tone reset, so the reset never shows.

  const gap = GAP * (1 - hidden + spring(t, 16.5));
  const leftTip = POINT_OVERSHOOT * (1 - hidden + spring(t, 17.5));

  const zoom = Math.pow(5, zIn - zOut);

  const worldX = tipL[0] + (tipR[0] - tipL[0]) * zPan, worldY = tipL[1] + (tipR[1] - tipL[1]) * zPan;
  const focusX = homeTipL[0] + (screenTipL[0] - homeTipL[0]) * zIn + (screenTipR[0] - screenTipL[0]) * zPan + (homeTipR[0] - screenTipR[0]) * zOut;
  const focusY = homeTipL[1] + (screenTipL[1] - homeTipL[1]) * zIn + (screenTipR[1] - screenTipL[1]) * zPan + (homeTipR[1] - screenTipR[1]) * zOut;

    const scale = rawScale < 0.05 ? 0 : rawScale;  // no specks left behind while a facet finishes shrinking

    const isBar = i < BAR_FACETS;
    const colourBack = isBar ? spring(t, 19.5 + 0.2 * i / 10, 12) : spring(t, 20 + 0.2 * (i - 11) / 13, 12);
    const ink = Math.max(0, hidden - colourBack);
    facetEls[i].setAttribute('fill', rgb(lerp3(lerp3(isBar ? PINK : BLUE, PALE, paleAmount), INK, ink)));
  });

  // Why pi: the symbol over the mark, then what a policy does in a battle.
  const ideaOff = spring(t, 4.5, 20);
  $('bigPi').setAttribute('opacity', Math.max(0, spring(t, 1, 12) - ideaOff));
  $('bigPi').setAttribute('transform', `translate(${BIG_PI_X},${BIG_PI_Y}) scale(${BIG_PI_SX},1)`);
  $('flowBattle').setAttribute('opacity', Math.max(0, spring(t, 2, 16) - ideaOff));
  const arrow1 = spring(t, 2.5, 16), arrow2 = spring(t, 3, 16);
  $('flowArrow1').setAttribute('x2', 325 + 100 * arrow1);
  $('flowArrow2').setAttribute('x2', 530 + 100 * arrow2);
  for (const id of ['flowArrow1', 'flowHead1', 'flowPi']) $(id).setAttribute('opacity', Math.max(0, arrow1 - ideaOff));
  for (const id of ['flowArrow2', 'flowHead2', 'flowMove']) $(id).setAttribute('opacity', Math.max(0, arrow2 - ideaOff));

  // Lattice.
  latticeLines.forEach(({ s, start }, i) => {
    const drawn = spring(t, start, 12);
    setLine(lineEls[i], T(s[0]), T([s[0][0] + (s[1][0] - s[0][0]) * drawn, s[0][1] + (s[1][1] - s[0][1]) * drawn]));
  });
  $('lattice').setAttribute('opacity', Math.max(0, 1 - 0.68 * spring(t, 16, 12) - 0.32 * spring(t, 20.5, 12)));

  // Unit edge and row height.
  const unitOn = spring(t, 11.5, 16), rowOn = spring(t, 12, 16), markOff = spring(t, 12.5, 24);
  const u0 = P(0, 0), u1 = P(1, 0), apex = P(0, 1), foot = [apex[0], 0];
  setLine($('unitLine'), T(u0), T([u0[0] + (u1[0] - u0[0]) * unitOn, u0[1]]));
  $('unitLine').setAttribute('opacity', 1 - markOff);
  const uMid = T([(u0[0] + u1[0]) / 2, 0]);
  $('unitLabel').setAttribute('x', uMid[0]); $('unitLabel').setAttribute('y', uMid[1] - 18);
  $('unitLabel').setAttribute('opacity', unitOn - markOff);
  setLine($('rowLine'), T(foot), T([foot[0], foot[1] + (apex[1] - foot[1]) * rowOn]));
  $('rowLine').setAttribute('opacity', 1 - markOff);
  const rMid = T([foot[0], apex[1] / 2]);
  $('rowLabel').setAttribute('x', rMid[0] + 12); $('rowLabel').setAttribute('y', rMid[1] + 14);
  $('rowLabel').setAttribute('opacity', rowOn - markOff);

  const plainL = facet(D(0, 0), GAP, 0, 0).map(T), plainR = facet(D(5, 0), GAP, 0, 0).map(T);
  $('ghostL').setAttribute('points', pointsAttr(plainL));
  $('ghostR').setAttribute('points', pointsAttr(plainR));
  for (const [id, tip] of [['L', plainL[0]], ['R', plainR[1]]]) {
    $('ghost' + id).setAttribute('opacity', ghostOp);
    $('anchor' + id).setAttribute('cx', tip[0]); $('anchor' + id).setAttribute('cy', tip[1]);
    $('anchor' + id).setAttribute('opacity', ghostOp);

  const sceneOff = spring(t, 9, 18);
  const inside = spring(t, 6, 14);
  const push = 1 + 0.6 * inside, factoryW = FACTORY_W * push, factoryH = FACTORY_H * push;
  const riseH = Math.round(factoryH * spring(t, 5, 10) / 3) * 3;  // whole sprite pixels
  $('factoryRevealRect').setAttribute('y', GROUND - riseH);
  $('factoryRevealRect').setAttribute('height', riseH);
  const factory = $('spFactory');
  factory.setAttribute('x', 540 - factoryW / 2); factory.setAttribute('y', GROUND - factoryH);
  factory.setAttribute('width', factoryW); factory.setAttribute('height', factoryH);
  factory.setAttribute('opacity', inside > 0.999 ? 0 : 1 - inside);
  const insideOp = Math.max(0, inside - sceneOff);
  $('spInside').setAttribute('opacity', insideOp < 0.001 ? 0 : insideOp);
  $('balls').setAttribute('opacity', insideOp < 0.001 ? 0 : insideOp);
  ballEls.forEach(({ lit, litAt }) => lit.setAttribute('opacity', litAt === null ? 0 : spring(t, litAt, 18)));
  // Outside Ethan walks to the door; inside he walks to the panels.
  if (t < 6) {
    const walked = spring(t, 5.5, 10);
    const through = walked < 0.04 ? 0 : Math.min(1, Math.max(0, (1 - walked) / 0.14));
    const stepOut = Math.abs(Math.sin(Math.PI * 3 * walked)) * 10 * through;

  } else {
    const walkedIn = spring(t, 6.5, 12);
    const stepIn = Math.abs(Math.sin(Math.PI * 3 * walkedIn)) * 10;
    placeSprite('spEthan', 280 + 100 * walkedIn, GROUND - 6 - stepIn, 240, 1, Math.max(0, spring(t, 6.1, 16) - sceneOff));
  }
  $('scenePi').setAttribute('opacity', Math.max(0, spring(t, 8, 16) - sceneOff));
  placeSprite('spPorygon', 870, 976, 576, 0.94 + 0.06 * spring(t, 19, 16), Math.max(0, spring(t, 19, 16) - spring(t, 22, 18)));
  const creditOp = spring(t, 5.5, 16) - sceneOff + spring(t, 19, 16) - spring(t, 22, 18);

  $('wBattle').style.color = rgb(lerp3(WORD_DIM, WORD_LIT, battleLit));
  $('wPorygon').style.color = rgb(lerp3(WORD_DIM, WORD_LIT, porygonLit));
  $('wPi').style.color = rgb(lerp3(WORD_DIM, WORD_LIT, piLit));
  const joinLit = battleLit * porygonLit * piLit;
  $('wOf').style.color = rgb(lerp3(WORD_DIM, WORD_LIT, joinLit));
  $('wDash').style.color = rgb(lerp3(WORD_DIM, WORD_LIT, joinLit));

};
const BIG_PI_X = 540, BIG_PI_Y = 870, BIG_PI_SX = 1.3;
seek(0);
</script>
